<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>조선, 나의 인생 — 태어난 신분이 운명을 결정하던 시대</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Nanum+Myeongjo:wght@400;700;800&family=Song+Myung&display=swap" rel="stylesheet">
<style>:root{--ink:#1c1714;--ink2:#3a2f27;--hanji:#efe6d2;--hanji2:#e2d6bb;--hanji3:#cbbb98;--indigo:#1f3350;--cinna:#a8322a;--gold:#c9a24a;--pine:#2f5446;
--serif:"Nanum Myeongjo","Batang","AppleMyungjo",serif;--disp:"Song Myung","Nanum Myeongjo",serif;--ui:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#0b0a09;overflow:hidden;font-family:var(--ui);color:var(--ink)}
button{font-family:inherit;cursor:pointer;color:inherit}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
#stage{position:absolute;left:50%;top:50%;width:1600px;height:900px;transform-origin:center;overflow:hidden;background:#000;user-select:none;-webkit-user-select:none;touch-action:manipulation}
.sc{position:absolute;inset:0;opacity:0;transition:opacity 1s ease}.sc.on{opacity:1}.sc svg{width:100%;height:100%;display:block}
#fx{position:absolute;inset:0;pointer-events:none;z-index:2}
#ui{position:absolute;inset:0;z-index:10}#ui:empty{pointer-events:none}
#overlay{position:absolute;inset:0;z-index:40;pointer-events:none}#overlay>*{pointer-events:auto}
.corner{position:absolute;top:22px;z-index:60;width:58px;height:58px;border-radius:50%;border:2px solid rgba(239,230,210,.5);background:rgba(28,23,20,.55);color:var(--hanji);font-size:24px;display:grid;place-items:center;padding:0}
#snd{right:22px}#home{right:92px;font-family:var(--disp);font-size:26px}
#snd.off::after{content:"";position:absolute;width:40px;height:3px;background:var(--cinna);transform:rotate(-45deg)}
#hud{position:absolute;left:0;right:0;top:0;z-index:20;display:flex;justify-content:space-between;align-items:flex-start;padding:22px 170px 0 26px;opacity:0;transform:translateY(-20px);transition:.6s;pointer-events:none}
#hud.on{opacity:1;transform:none}
#hud-name{display:flex;align-items:center;gap:14px;background:linear-gradient(90deg,rgba(24,20,17,.85),rgba(24,20,17,.4));padding:10px 26px 10px 12px;border-radius:44px;color:var(--hanji)}
.np-seal{width:62px;height:62px;border-radius:8px;background:var(--cinna);color:#f6e6c8;font-family:var(--disp);font-size:22px;display:grid;place-items:center;line-height:1.05;writing-mode:vertical-rl;box-shadow:inset 0 0 0 3px rgba(255,230,200,.35)}
.np-txt b{display:block;font-family:var(--serif);font-size:30px;font-weight:800;letter-spacing:2px}.np-txt span{font-size:18px;opacity:.85}
#hud-stats{display:flex;gap:6px;background:rgba(24,20,17,.72);padding:8px 10px;border-radius:16px}
.st{position:relative;display:flex;align-items:center;gap:7px;padding:5px 10px 10px 6px;border-radius:10px;color:var(--hanji);min-width:100px;transition:background .3s}
.st i{font-style:normal;font-family:var(--disp);font-size:24px;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--hanji);color:var(--cinna)}
.st small{display:block;font-size:14px;opacity:.75}.st b{font-size:21px}
.st-bar{position:absolute;left:50px;right:10px;bottom:4px;height:4px;background:rgba(255,255,255,.15);border-radius:2px;overflow:hidden}
.st-bar em{display:block;height:100%;background:var(--gold);transition:width .8s}
.st.glow-up{background:rgba(120,190,120,.3)}.st.glow-dn{background:rgba(200,70,60,.35)}
.chip-fx{position:absolute;left:50%;top:60px;transform:translateX(-50%);font-weight:800;font-size:24px;padding:3px 12px;border-radius:14px;animation:chipUp 1.7s ease forwards;white-space:nowrap}
.chip-fx.up{background:#2f5446;color:#e9f5dc}.chip-fx.dn{background:#8a2a22;color:#fde3dc}
@keyframes chipUp{0%{opacity:0;transform:translate(-50%,-10px)}15%{opacity:1;transform:translate(-50%,0)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,24px)}}
#panel{position:absolute;left:40px;right:40px;bottom:28px;height:232px;z-index:25;background:linear-gradient(180deg,rgba(242,234,215,.96),rgba(228,216,190,.97));border-radius:6px;padding:28px 60px 22px;box-shadow:0 18px 50px rgba(0,0,0,.5),inset 0 0 0 1px rgba(120,90,50,.35),inset 0 0 60px rgba(160,120,60,.18);opacity:0;transform:translateY(30px);transition:.45s;pointer-events:none;cursor:pointer}
#panel.on{opacity:1;transform:none;pointer-events:auto}
#panel::before,#panel::after{content:"";position:absolute;top:-8px;bottom:-8px;width:22px;background:linear-gradient(90deg,#4a2f1d,#7a5434,#4a2f1d);border-radius:6px}
#panel::before{left:-12px}#panel::after{right:-12px}
#panel-title{position:absolute;top:-24px;left:60px;background:var(--indigo);color:var(--hanji);font-family:var(--serif);font-weight:700;font-size:21px;padding:8px 22px;border-radius:3px;letter-spacing:1px;box-shadow:0 6px 14px rgba(0,0,0,.3)}
#panel-text{font-family:var(--serif);font-size:28px;line-height:1.7;color:var(--ink);word-break:keep-all;max-width:1380px}
#panel-next{position:absolute;right:46px;bottom:16px;font-size:20px;color:var(--cinna);opacity:0;transition:.3s;font-weight:700}
#panel-next.ready{opacity:1;animation:bob 1s infinite}
@keyframes bob{50%{transform:translateY(5px)}}
#choices{position:absolute;right:56px;bottom:290px;width:720px;z-index:30;display:flex;flex-direction:column;gap:12px;pointer-events:none}
#choices.on{pointer-events:auto}
.choice{display:flex;align-items:center;gap:18px;text-align:left;border:none;padding:14px 26px 14px 14px;background:linear-gradient(90deg,rgba(242,234,215,.97),rgba(232,221,196,.95));border-radius:4px;box-shadow:0 10px 26px rgba(0,0,0,.42),inset 0 0 0 1px rgba(120,90,50,.4);opacity:0;transform:translateX(40px);transition:transform .2s,background .2s,box-shadow .2s}
#choices.on .choice{animation:chIn .45s forwards}
@keyframes chIn{to{opacity:1;transform:none}}
.choice:hover{background:linear-gradient(90deg,#fff7e4,#efe2c2);box-shadow:0 14px 30px rgba(0,0,0,.5),inset 5px 0 0 var(--cinna)}
.ch-mark{flex:none;width:50px;height:50px;border-radius:6px;background:var(--cinna);color:#f8e8cc;font-family:var(--disp);font-size:28px;display:grid;place-items:center}
.ch-body b{display:block;font-family:var(--serif);font-size:25px;font-weight:700;line-height:1.35;word-break:keep-all}
.ch-body small{display:block;font-size:18px;color:#6b5a48;margin-top:3px}
.choice.locked{filter:grayscale(.9);opacity:.75!important;cursor:not-allowed}.choice.locked .ch-mark{background:#6b6560}
.shake{animation:shake .4s!important}
@keyframes shake{20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
.btn-main,.btn-sub,.btn-fate{border:none;border-radius:4px;padding:16px 34px;font-size:23px;font-weight:700;transition:.2s}
.btn-main{background:var(--indigo);color:var(--hanji);box-shadow:0 6px 0 #0f1b2c}
.btn-main:hover:not(:disabled){background:#2b4670}
.btn-main:active:not(:disabled){transform:translateY(3px);box-shadow:0 2px 0 #0f1b2c}
.btn-main:disabled{opacity:.4;cursor:not-allowed}
.btn-main.big{font-size:30px;padding:22px 70px}
.btn-sub{background:var(--hanji2);color:var(--ink2);box-shadow:inset 0 0 0 2px var(--hanji3)}
.btn-sub:hover:not(:disabled){background:#efe3c6}.btn-sub:disabled{opacity:.4}
.btn-fate{background:var(--cinna);color:#fbe9cf;box-shadow:0 6px 0 #5e1a14}.btn-fate:hover{background:#bf3e33}
.btn-sm{border:none;border-radius:4px;padding:10px 18px;font-size:20px;font-weight:700;background:var(--indigo);color:var(--hanji);min-width:64px}
.btn-sm.sell{background:var(--cinna)}
.title-scr{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 45%,rgba(5,9,20,.15),rgba(5,9,20,.78))}
.logo{position:relative;text-align:center;color:var(--hanji);margin-top:-50px}
.logo-sub-top{font-size:22px;letter-spacing:12px;opacity:.75;margin-bottom:10px}
.logo h1{margin:0;font-family:var(--disp);font-weight:400;line-height:.95}
.logo .l1{display:block;font-size:84px;letter-spacing:20px;transform:translateX(-150px);color:#d8c9a6;text-shadow:0 6px 30px rgba(0,0,0,.7)}
.logo .l2{display:block;font-size:170px;letter-spacing:8px;background:linear-gradient(180deg,#fff6df,#e5c886 60%,#b98c3e);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 8px 20px rgba(0,0,0,.7))}
.logo-seal{position:absolute;right:-70px;top:96px;width:86px;height:86px;border:5px solid var(--cinna);color:var(--cinna);font-family:var(--disp);font-size:36px;writing-mode:vertical-rl;display:grid;place-items:center;transform:rotate(8deg);background:rgba(239,230,210,.92);border-radius:6px;line-height:1}
.logo-sub{margin-top:22px;font-family:var(--serif);font-size:28px;letter-spacing:5px;color:#ead9b4}
.title-menu{margin-top:54px;display:flex;flex-direction:column;gap:16px;align-items:center}
.btn-title{min-width:420px;padding:20px 40px;border:1px solid rgba(233,214,170,.6);background:linear-gradient(180deg,rgba(31,51,80,.94),rgba(18,30,48,.94));color:var(--hanji);font-family:var(--serif);font-size:30px;font-weight:700;letter-spacing:4px;border-radius:3px;box-shadow:0 10px 30px rgba(0,0,0,.5);transition:.2s}
.btn-title:hover{transform:translateY(-3px);border-color:var(--gold)}
.btn-title.ghost{background:rgba(24,20,17,.65);font-size:24px}
.btn-title small{display:block;font-family:var(--ui);font-size:17px;letter-spacing:1px;opacity:.75;font-weight:400;margin-top:4px}
.title-note{position:absolute;bottom:34px;color:rgba(239,230,210,.6);font-size:18px}
.setup{position:absolute;inset:0;background:linear-gradient(180deg,rgba(18,15,12,.86),rgba(18,15,12,.65));padding:34px 60px;color:var(--hanji)}
.setup h2{margin:0 0 16px;font-family:var(--disp);font-weight:400;font-size:52px;letter-spacing:4px}
.setup-row{display:flex;align-items:center;gap:18px;font-size:22px}
.setup-row label{font-family:var(--serif);font-weight:700}
#nm{width:260px;padding:12px 18px;font-size:26px;font-family:var(--serif);border:none;border-radius:4px;background:var(--hanji);color:var(--ink)}
.gsel{display:flex;border-radius:4px;overflow:hidden;border:2px solid var(--hanji3)}
.gsel button{border:none;padding:11px 26px;font-size:22px;background:transparent;color:var(--hanji)}
.gsel button.on{background:var(--hanji);color:var(--ink);font-weight:700}
.gnote{opacity:.7;font-size:18px}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:22px;margin-top:24px}
.scard{border:none;padding:0;background:var(--hanji);border-radius:6px;overflow:hidden;text-align:left;color:var(--ink);transition:.25s;box-shadow:0 12px 30px rgba(0,0,0,.45);position:relative}
.scard:hover{transform:translateY(-6px)}
.scard.sel{box-shadow:0 0 0 5px var(--gold),0 18px 40px rgba(0,0,0,.6);transform:translateY(-10px)}
.scard.fate{animation:fate 1s}
@keyframes fate{30%{box-shadow:0 0 0 12px #fff2c0,0 0 80px #ffd27a}}
.sc-art{height:250px;overflow:hidden;background:#333}.sc-art svg{width:100%;height:100%;display:block}
.sc-name{display:flex;align-items:baseline;gap:12px;padding:14px 20px 4px;font-family:var(--serif);font-size:36px;font-weight:800}
.sc-name i{font-style:normal;font-family:var(--disp);font-weight:400;font-size:24px;color:var(--cinna)}
.scard ul{list-style:none;margin:0;padding:6px 20px 18px}
.scard li{font-size:19px;line-height:1.45;margin:6px 0;word-break:keep-all}
.scard li em{font-style:normal;display:inline-block;min-width:46px;margin-right:8px;font-size:15px;font-weight:700;color:#fff;background:var(--pine);padding:1px 7px;border-radius:3px;text-align:center}
.class-brace{display:grid;grid-template-columns:3fr 1fr;gap:22px;margin-top:12px}
.class-brace>div{border-top:3px solid;text-align:center;padding-top:6px;font-family:var(--serif);font-size:22px;font-weight:700}
.cb-yang{border-color:#d9a24a;color:#e7c27a}.cb-cheon{border-color:#7c9cc8;color:#9cb8de}
.setup-foot{position:absolute;left:60px;right:60px;bottom:30px;display:flex;justify-content:flex-end;gap:16px}
.setup-foot .btn-sub{margin-right:auto}
.chapter{position:absolute;inset:0;background:radial-gradient(ellipse at center,#2a231c,#0c0a08);display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--hanji);opacity:0;transition:opacity .6s;cursor:pointer}
.chapter.show{opacity:1}
.chap-num{font-family:var(--disp);font-size:240px;line-height:1;color:var(--cinna);opacity:.85;text-shadow:0 0 60px rgba(168,50,42,.5);transform:scale(1.1);transition:transform 3s}
.chapter.show .chap-num{transform:none}
.chap-t{font-family:var(--serif);font-weight:800;font-size:64px;letter-spacing:10px;margin-top:10px}
.chap-s{font-family:var(--serif);font-size:30px;opacity:.75;letter-spacing:6px;margin-top:12px}
.chap-hint{position:absolute;bottom:40px;opacity:.4;font-size:18px}
.fact{position:absolute;left:50%;top:46%;width:820px;transform:translate(-50%,-44%) scale(.94);opacity:0;transition:.3s;background:var(--hanji);border-radius:4px;padding:40px 54px 34px;box-shadow:0 0 0 2000px rgba(0,0,0,.45),0 30px 80px rgba(0,0,0,.65),inset 0 0 0 1px #b39c74,inset 0 0 0 10px var(--hanji),inset 0 0 0 11px #c9b48a}
.fact.show{opacity:1;transform:translate(-50%,-50%)}
.fact-tag{display:inline-block;background:var(--pine);color:#f0ead8;font-size:18px;font-weight:700;padding:5px 14px;border-radius:3px}
.fact.extra .fact-tag{background:var(--indigo)}.fact.fiction .fact-tag{background:#8a6a3a}
.fact h3{font-family:var(--serif);font-size:38px;margin:14px 0 10px}
.fact p{font-family:var(--serif);font-size:24px;line-height:1.75;margin:0 0 24px;word-break:keep-all}
.fact .btn-main{float:right}
.mg{position:absolute;inset:0;background:rgba(10,8,6,.62);opacity:0;transition:.3s;display:grid;place-items:center}
.mg.show{opacity:1}
.mg-board{position:relative;width:1400px;height:820px;background:linear-gradient(180deg,#f2ead6,#e4d7ba);border-radius:6px;box-shadow:0 30px 90px rgba(0,0,0,.7),inset 0 0 0 1px #a8916a;display:flex;flex-direction:column;padding:24px 44px 22px;transform:scale(.96);transition:.3s;overflow:hidden}
.mg.show .mg-board{transform:none}
.mg-head{border-bottom:2px solid #c9b48a;padding-bottom:10px;margin-bottom:14px}
.mg-title{font-family:var(--serif);font-weight:800;font-size:34px}
.mg-guide{font-size:20px;color:#5d4c3a;margin-top:4px}
.mg-body{flex:1;position:relative;min-height:0}
.mg-foot{display:flex;justify-content:center;gap:16px;padding-top:12px}.mg-foot:empty{display:none}
.mg-result{position:absolute;inset:0;background:rgba(242,234,214,.96);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;animation:fadeIn .4s;z-index:5}
@keyframes fadeIn{from{opacity:0}}
.mg-seal{width:150px;height:150px;border:8px solid var(--cinna);border-radius:12px;color:var(--cinna);font-family:var(--disp);font-size:100px;display:grid;place-items:center;transform:rotate(-8deg);animation:stamp .5s cubic-bezier(.3,1.6,.5,1)}
.mg-result.no .mg-seal{border-color:#555;color:#555}
@keyframes stamp{from{transform:scale(2.4) rotate(-20deg);opacity:0}}
.mg-stars{font-size:46px;letter-spacing:12px;color:#c9bca2}.mg-stars .on{color:var(--gold)}
.mg-rmsg{font-family:var(--serif);font-size:30px;font-weight:700;text-align:center;max-width:1000px;word-break:keep-all}
.find-wrap{display:flex;flex-direction:column;align-items:center;gap:14px;height:100%}
.find-scene{position:relative;width:1060px;height:596px;border-radius:4px;overflow:hidden;box-shadow:0 8px 20px rgba(0,0,0,.3)}
.find-scene svg{width:100%;height:100%;display:block}
.find-hit{position:absolute;border:none;background:transparent;border-radius:50% 50% 12px 12px;padding:0}
.find-hit:hover{background:rgba(255,240,200,.18);box-shadow:0 0 0 3px rgba(255,240,200,.6)}
.find-tag{position:absolute;left:50%;top:-6px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:3px 14px;border-radius:3px;font-size:20px;font-weight:700;opacity:0}
.find-hit.good{box-shadow:0 0 0 5px #4caf50;background:rgba(80,180,80,.18)}.find-hit.good .find-tag{opacity:1;background:var(--pine)}
.find-hit.bad{box-shadow:0 0 0 5px var(--cinna);background:rgba(200,60,40,.2)}
.find-q{font-family:var(--serif);font-size:27px;font-weight:700;text-align:center;max-width:1100px;word-break:keep-all}
.find-q b{color:var(--cinna);margin-right:10px}
.trace-wrap{display:flex;gap:50px;justify-content:center;align-items:center;height:100%}
.trace-side{text-align:center;width:260px}
.trace-char{font-family:var(--disp);font-size:150px;line-height:1}
.trace-read{font-family:var(--serif);font-size:32px;font-weight:700;margin-top:10px}
.trace-prog{margin-top:14px;font-size:20px;color:#7a6650}
.trace-paper{position:relative;width:500px;height:500px;background:#f8f2e2;border:2px solid #a8916a;box-shadow:inset 0 0 40px rgba(160,130,80,.25)}
.trace-paper.dirt{background:#b89a72;box-shadow:inset 0 0 60px rgba(70,40,10,.45)}
.trace-paper canvas{position:absolute;left:18px;top:18px;width:460px;height:460px}
.trace-paper .tu{touch-action:none;cursor:crosshair}
.trace-grade{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) rotate(-6deg);background:var(--cinna);color:#fff2dc;font-family:var(--serif);font-weight:800;font-size:34px;padding:12px 26px;border-radius:4px;animation:stamp .4s;white-space:nowrap}
.slots-wrap{display:flex;flex-direction:column;justify-content:space-between;height:100%;gap:16px}
.slots-targets{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
.slot{flex:1;max-width:300px;min-width:120px;background:rgba(255,255,255,.35);border:2px dashed #a8916a;border-radius:6px;padding:10px;display:flex;flex-direction:column;align-items:center;gap:8px;transition:.2s}
.slot-label{font-family:var(--serif);font-size:23px;font-weight:700;text-align:center;word-break:keep-all}
.slot-num{display:inline-grid;place-items:center;width:46px;height:46px;border-radius:50%;background:var(--indigo);color:#fff;font-size:24px}
.slot-drop{min-height:86px;width:100%;display:grid;place-items:center}
.slot.filled{border-style:solid;border-color:var(--pine);background:rgba(47,84,70,.12)}
.slot.flash{animation:flash .6s}
@keyframes flash{30%{background:rgba(120,200,120,.5)}}
.slots-wrap.order .slots-targets{flex-wrap:nowrap}
.slots-wrap.order .slot{min-width:0}
.slots-pool{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;min-height:110px;padding:14px;background:rgba(120,90,50,.1);border-radius:6px;align-content:center}
.chip{background:#fffaf0;border-radius:5px;box-shadow:0 5px 0 #b8a27a,0 8px 16px rgba(0,0,0,.18);padding:16px 20px;font-family:var(--serif);font-size:23px;font-weight:700;text-align:center;touch-action:none;cursor:grab;word-break:keep-all;transition:transform .15s}
.chip.big{font-size:36px;font-family:var(--disp);font-weight:400;padding:14px 28px}
.chip.sel{box-shadow:0 0 0 4px var(--gold),0 5px 0 #b8a27a}
.chip.drag{opacity:.3}
.chip.done{box-shadow:none;background:transparent;cursor:default;padding:4px}
.chip.ghost{position:absolute;z-index:100;pointer-events:none;transform:rotate(-3deg) scale(1.05);box-shadow:0 20px 40px rgba(0,0,0,.4)}
.slots-wrap.story .slot{max-width:310px}.slots-wrap.story .slot-drop{min-height:200px}
.chip.pic{width:290px;padding:10px;font-size:17px;line-height:1.4;font-family:var(--ui);font-weight:400}
.chip.pic svg{width:100%;height:auto;display:block;margin-bottom:6px;border:1px solid #a8916a}
.slots-wrap.story .chip.done{width:100%}.slots-wrap.story .chip.done span{display:none}
.pick-q{font-family:var(--serif);font-size:36px;font-weight:800;text-align:center;margin:30px 0 40px;word-break:keep-all}
.pick-opts{display:grid;grid-template-columns:1fr 1fr;gap:18px;max-width:1000px;margin:0 auto}
.pick-opts.multi{grid-template-columns:1fr 1fr 1fr}
.opt{border:none;background:#fffaf0;padding:24px;font-size:28px;font-family:var(--serif);font-weight:700;border-radius:6px;box-shadow:0 6px 0 #b8a27a;transition:.15s}

.march-field{position:relative;height:430px;background:linear-gradient(180deg,#bcd2d9,#e8e0c8 55%,#c4ae84 56%,#a8916a);border-radius:6px;overflow:hidden}

.book{position:relative;width:1340px;height:690px;display:grid;grid-template-columns:1fr 1fr;perspective:2400px;filter:drop-shadow(0 30px 50px rgba(0,0,0,.65))}
.book::before{content:"";position:absolute;inset:-14px;background:#4a2a1c;border-radius:8px;z-index:-1;box-shadow:inset 0 0 0 4px #6b3f28}
.page{background:linear-gradient(90deg,#efe6cf,#f7f0dc 15%,#f7f0dc 85%,#e8dcc0);padding:44px 56px;overflow:hidden;position:relative}
.page.left{background:linear-gradient(90deg,#e8dcc0,#f7f0dc 12%,#f7f0dc 88%,#d9c9a6);border-radius:4px 0 0 4px}
.page.right{border-radius:0 4px 4px 0}
.flip{position:absolute;top:0;bottom:0;width:50%;right:0;transform-origin:left center;background:#f4ecd6;padding:44px 56px;overflow:hidden;opacity:0;pointer-events:none}
.flip.go-next{animation:flipN .7s ease-in forwards}
.flip.go-prev{left:0;right:auto;transform-origin:right center;animation:flipP .7s ease-in forwards}
@keyframes flipN{0%{opacity:1;transform:rotateY(0)}99%{opacity:1;transform:rotateY(-175deg);filter:brightness(.6)}100%{opacity:0}}
@keyframes flipP{0%{opacity:1;transform:rotateY(0)}99%{opacity:1;transform:rotateY(175deg);filter:brightness(.6)}100%{opacity:0}}
.pg{position:relative}
.pg h4{font-family:var(--serif);font-size:34px;margin:0 0 14px;border-bottom:1px solid #b39c74;padding-bottom:10px}
.pg p{font-family:var(--serif);font-size:20.5px;line-height:1.8;margin:0 0 8px;text-indent:1em;word-break:keep-all}
.pg-ch{position:absolute;right:0;top:-14px;font-family:var(--disp);font-size:64px;color:rgba(168,50,42,.25)}
.pg.cover{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.cv-seal{width:96px;height:96px;background:var(--cinna);color:#f8e6c8;font-family:var(--disp);font-size:34px;writing-mode:vertical-rl;display:grid;place-items:center;border-radius:8px;transform:rotate(-4deg)}
.cv-title{font-family:var(--disp);font-size:58px;margin:34px 0 18px;line-height:1.25;word-break:keep-all}
.cv-sub{font-family:var(--serif);font-size:24px;line-height:1.7;color:#5d4c3a}
.cv-deco{width:180px;height:2px;background:var(--cinna);margin-top:30px}
.rec{display:flex;flex-direction:column;gap:12px;margin-top:10px}
.rec-row{display:grid;grid-template-columns:44px 80px 100px 1fr;align-items:center;gap:10px;font-size:22px}
.rec-row i{font-style:normal;font-family:var(--disp);width:40px;height:40px;border-radius:50%;background:var(--cinna);color:#fff;display:grid;place-items:center;font-size:22px}
.rec-row b{font-size:24px}
.rec-row em{height:12px;background:rgba(0,0,0,.1);border-radius:6px;overflow:hidden}
.rec-row u{display:block;height:100%;background:var(--gold)}
.rec-note{text-indent:0!important;font-size:18px!important;color:#6b5a48;margin-top:18px!important}
.knl{display:grid;grid-template-columns:1fr 1fr;gap:5px 18px}
.kn{display:flex;gap:8px;font-size:17px;color:#a89a84;line-height:1.35}
.kn b{color:#b8a888}.kn.on{color:var(--ink)}.kn.on b{color:var(--cinna)}
.pg.last{height:100%;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:20px}
.pg .q{font-family:var(--serif);font-size:32px!important;font-weight:800;line-height:1.6!important;text-indent:0!important;color:var(--indigo)}
.pg-end{font-family:var(--serif);font-size:22px;color:#7a6650;margin-top:30px}
.book-ctrl{display:flex;align-items:center;gap:30px;color:var(--hanji);font-size:22px}
.book-act{display:flex;gap:14px}
.toast{position:absolute;left:50%;bottom:120px;transform:translate(-50%,20px);background:var(--ink);color:var(--hanji);padding:16px 30px;border-radius:30px;font-size:22px;opacity:0;transition:.35s;z-index:200}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

<body>
<div id="stage">
  <div id="scA" class="sc"></div><div id="scB" class="sc"></div>
  <canvas id="fx" width="1600" height="900"></canvas>
  <div id="hud"><div id="hud-name"></div><div id="hud-stats"></div></div>
  <div id="ui"></div>
  <div id="choices"></div>
  <div id="panel"><div id="panel-title"></div><div id="panel-text"></div><div id="panel-next">▼ 눌러서 계속</div></div>
  <div id="overlay"></div>
  <button id="home" class="corner" title="처음 화면">家</button>
  <button id="snd" class="corner" title="소리 끄기">♪</button>
</div>
<script>/* ===================== ART: 장면 & 인물 ===================== */
const ART = (() => {
  const W = 1600, H = 900;
  const rng = seed => { let s = (seed >>> 0) || 7; return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; };
  let UID = 0; const uid = p => p + (++UID);

  const SKY = {
    dawn:  ['#28304f', '#6c5578', '#d99579', '#f4d3a0'],
    day:   ['#5584b3', '#86afd0', '#c4dbe6', '#eef0e4'],
    dusk:  ['#231f40', '#5f3656', '#c25e45', '#f1b469'],
    night: ['#050916', '#0c1630', '#18284a', '#283a5a']
  };
  const SEASON = {
    spring: { m: ['#a9bcb2', '#7b9a82', '#55805c'], ground: ['#97b276', '#6f9152'], leaf: ['#7fa864', '#a9c97f'], bloom: '#f2b8c6' },
    summer: { m: ['#92aca8', '#57856a', '#2f5f42'], ground: ['#6b9450', '#4b7438'], leaf: ['#3f7a45', '#5f9a52'], bloom: null },
    autumn: { m: ['#b7a891', '#b0713f', '#7d4a2a'], ground: ['#b39558', '#8a6c3a'], leaf: ['#c8642c', '#e0a13b'], bloom: null },
    winter: { m: ['#cdd6de', '#a8b6c3', '#8193a3'], ground: ['#e9eef2', '#cfd8df'], leaf: ['#c9d3da', '#e8edf0'], bloom: null }
  };

  /* ---------- 공용 defs ---------- */
  function defs(o) {
    const sk = SKY[o.time] || SKY.day;
    return `<defs>
      <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="${sk[0]}"/><stop offset=".45" stop-color="${sk[1]}"/>
        <stop offset=".78" stop-color="${sk[2]}"/><stop offset="1" stop-color="${sk[3]}"/></linearGradient>
      <radialGradient id="sunglow"><stop offset="0" stop-color="#fff6d8" stop-opacity=".95"/><stop offset=".2" stop-color="#ffe2a0" stop-opacity=".6"/><stop offset="1" stop-color="#ffcc80" stop-opacity="0"/></radialGradient>
      <radialGradient id="moonglow"><stop offset="0" stop-color="#f4f1de" stop-opacity=".9"/><stop offset=".25" stop-color="#cfd8e8" stop-opacity=".35"/><stop offset="1" stop-color="#9fb2d0" stop-opacity="0"/></radialGradient>
      <radialGradient id="lamp"><stop offset="0" stop-color="#ffd58a" stop-opacity=".95"/><stop offset=".35" stop-color="#f5a74a" stop-opacity=".45"/><stop offset="1" stop-color="#f08a2a" stop-opacity="0"/></radialGradient>
      <radialGradient id="vign" cx=".5" cy=".46" r=".75"><stop offset=".55" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".55"/></radialGradient>
      <linearGradient id="roofG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#565c66"/><stop offset="1" stop-color="#2b2f36"/></linearGradient>
      <linearGradient id="thatchG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d6b467"/><stop offset=".7" stop-color="#a98a46"/><stop offset="1" stop-color="#7a6230"/></linearGradient>
      <linearGradient id="wallG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#efe7d6"/><stop offset="1" stop-color="#d6cbb4"/></linearGradient>
      <linearGradient id="mudG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#cfae80"/><stop offset="1" stop-color="#a88558"/></linearGradient>
      <linearGradient id="woodG" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#5a3826"/><stop offset=".5" stop-color="#7d5034"/><stop offset="1" stop-color="#4c2f20"/></linearGradient>
      <linearGradient id="redwood" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7d2a22"/><stop offset=".5" stop-color="#a5402f"/><stop offset="1" stop-color="#6c241d"/></linearGradient>
      <linearGradient id="stoneG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c7c1b4"/><stop offset="1" stop-color="#8f897d"/></linearGradient>
      <linearGradient id="floorG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c9964f"/><stop offset="1" stop-color="#8d6230"/></linearGradient>
      <linearGradient id="seaG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${o.time === 'night' ? '#1a2a44' : o.time === 'dusk' ? '#6b4a5a' : '#5e8ea8'}"/><stop offset="1" stop-color="${o.time === 'night' ? '#0b1424' : '#2c5670'}"/></linearGradient>
      <linearGradient id="skinA" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f4d6ba"/><stop offset="1" stop-color="#ddae8c"/></linearGradient>
      <linearGradient id="skinB" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e6bc95"/><stop offset="1" stop-color="#c38f68"/></linearGradient>
      <pattern id="lattice" width="22" height="22" patternUnits="userSpaceOnUse"><rect width="22" height="22" fill="#f3ead2"/><path d="M0 0H22M0 11H22M0 0V22M11 0V22" stroke="#7a5536" stroke-width="2"/></pattern>
      <pattern id="latticeLit" width="22" height="22" patternUnits="userSpaceOnUse"><rect width="22" height="22" fill="#ffd98f"/><path d="M0 0H22M0 11H22M0 0V22M11 0V22" stroke="#6b3f20" stroke-width="2"/></pattern>
      <pattern id="tiles" width="14" height="10" patternUnits="userSpaceOnUse"><path d="M7 0V10" stroke="#1d2026" stroke-width="3" opacity=".55"/></pattern>
      <pattern id="straw" width="16" height="9" patternUnits="userSpaceOnUse"><path d="M0 9 Q8 2 16 9" stroke="#7b6128" stroke-width="1.2" fill="none" opacity=".55"/></pattern>
      <pattern id="paving" width="60" height="34" patternUnits="userSpaceOnUse"><rect width="60" height="34" fill="#b9b3a7"/><path d="M0 0H60M0 17H60M0 0V17M30 17V34" stroke="#8d877b" stroke-width="2"/></pattern>
      <filter id="blur3"><feGaussianBlur stdDeviation="3"/></filter>
      <filter id="blur6"><feGaussianBlur stdDeviation="6"/></filter>
      <filter id="blur14"><feGaussianBlur stdDeviation="14"/></filter>
      <filter id="blur30"><feGaussianBlur stdDeviation="30"/></filter>
      <filter id="ink" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency=".012" numOctaves="3" seed="4"/><feDisplacementMap in="SourceGraphic" scale="14"/></filter>
      <filter id="paper"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" seed="9"/><feColorMatrix values="0 0 0 0 .35  0 0 0 0 .28  0 0 0 0 .2  0 0 0 .55 0"/></filter>
      <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000" flood-opacity=".35"/></filter>
    </defs>`;
  }

  /* ---------- 하늘·산·안개 ---------- */
  function ridge(r, y, amp, freq, jag) {
    let d = `M0 ${H} L0 ${y}`;
    const ph = r() * 10, ph2 = r() * 10;
    for (let x = 0; x <= W; x += 20) {
      const v = Math.sin(x * freq + ph) * amp + Math.sin(x * freq * 2.7 + ph2) * amp * .35 + (r() - .5) * jag;
      d += ` L${x} ${(y - v).toFixed(1)}`;
    }
    return d + ` L${W} ${H} Z`;
  }
  function sky(o, r) {
    let s = `<rect width="${W}" height="${H}" fill="url(#sky)"/>`;
    if (o.time === 'night') {
      for (let i = 0; i < 90; i++) s += `<circle cx="${(r() * W).toFixed(0)}" cy="${(r() * 420).toFixed(0)}" r="${(r() * 1.6 + .3).toFixed(1)}" fill="#fff" opacity="${(r() * .7 + .2).toFixed(2)}"/>`;
      s += `<circle cx="1260" cy="150" r="170" fill="url(#moonglow)"/><circle cx="1260" cy="150" r="44" fill="#f3efdc"/><circle cx="1248" cy="140" r="9" fill="#d9d3bd" opacity=".6"/><circle cx="1275" cy="165" r="6" fill="#d9d3bd" opacity=".5"/>`;
    } else if (o.time === 'dawn') {
      s += `<circle cx="300" cy="470" r="300" fill="url(#sunglow)"/><circle cx="300" cy="470" r="46" fill="#ffe9b8" opacity=".95"/>`;
    } else if (o.time === 'dusk') {
      s += `<circle cx="1300" cy="440" r="340" fill="url(#sunglow)"/><circle cx="1300" cy="440" r="52" fill="#ffd48a"/>`;
    } else {
      s += `<circle cx="1200" cy="120" r="260" fill="url(#sunglow)" opacity=".7"/>`;
    }
    // 구름
    const cc = o.time === 'night' ? '#2c3a58' : o.time === 'dusk' ? '#e39a78' : o.time === 'dawn' ? '#f0c2a2' : '#ffffff';
    const cop = o.weather === 'rain' ? .0 : .55;
    for (let i = 0; i < 5; i++) {
      const x = r() * W, y = 80 + r() * 220, w = 160 + r() * 260;
      s += `<g opacity="${cop}" filter="url(#blur14)"><ellipse cx="${x}" cy="${y}" rx="${w}" ry="${w * .16}" fill="${cc}"/><ellipse cx="${x + w * .3}" cy="${y - 18}" rx="${w * .5}" ry="${w * .14}" fill="${cc}"/></g>`;
    }
    if (o.weather === 'rain' || o.weather === 'storm') s += `<rect width="${W}" height="${H}" fill="#3d4652" opacity=".55"/>`;
    if (o.weather === 'snow') s += `<rect width="${W}" height="${H}" fill="#dfe6ee" opacity=".25"/>`;

      const hit = $(`<button class="find-hit" style="left:${(q.x - 110) / 16}%;top:${(840 - 420) / 9}%;width:${220 / 16}%;height:${440 / 9}%"><span class="find-tag">${labels[q.id]}</span></button>`);
      hit.dataset.id = q.id; wrap.appendChild(hit);
    });
    let i = 0, right = 0, tried = false;
    const qel = F.body.querySelector('.find-q');
    const show = () => { qel.innerHTML = `<b>${i + 1} / ${rounds.length}</b> ${rounds[i].q}`; tried = false; wrap.querySelectorAll('.find-hit').forEach(b => b.classList.remove('good', 'bad')); };
    show();
    wrap.querySelectorAll('.find-hit').forEach(b => b.onclick = () => {
      if (b.classList.contains('lock')) return;
      if (b.dataset.id === rounds[i].a) {
        b.classList.add('good'); SND.sfx('up'); if (!tried) right++;
        wrap.querySelectorAll('.find-hit').forEach(x => x.classList.add('lock'));
        later(() => { wrap.querySelectorAll('.find-hit').forEach(x => x.classList.remove('lock')); i++; if (i >= rounds.length) finish(F, right / rounds.length, `${rounds.length}문제 중 ${right}문제를 한 번에 맞혔다.`, done); else show(); }, 900);
      } else { b.classList.add('bad'); SND.sfx('down'); tried = true; later(() => b.classList.remove('bad'), 600); }
    });
  }

  /* ---------- 2. 붓글씨 따라 쓰기 ---------- */
  function trace(p, S, done) {
    const F = frame(p.title || '붓글씨 따라 쓰기', '흐린 글자 위를 손가락이나 마우스로 따라 쓰세요. 획을 꽉 채울수록 좋아요.');
    const chars = p.chars; let ci = 0; const scores = [];
    F.body.innerHTML = `<div class="trace-wrap"><div class="trace-side"><div class="trace-char"></div><div class="trace-read"></div><div class="trace-prog"></div></div><div class="trace-paper ${p.stick ? 'dirt' : ''}"><canvas width="460" height="460" class="tg"></canvas><canvas width="460" height="460" class="tu"></canvas></div></div>`;
    F.foot.innerHTML = `<button class="btn-sub">다시 쓰기</button><button class="btn-main">다 썼어요</button>`;
    const cg = F.body.querySelector('.tg'), cu = F.body.querySelector('.tu');
    const g = cg.getContext('2d'), u = cu.getContext('2d');
    let drawing = false, last = null, inkUsed = 0;
    const font = `"Song Myung","Nanum Myeongjo","Batang","AppleMyungjo",serif`;
    function setup() {
      g.clearRect(0, 0, 460, 460); u.clearRect(0, 0, 460, 460); inkUsed = 0;
      g.strokeStyle = 'rgba(150,40,30,.25)'; g.lineWidth = 2; g.setLineDash([8, 8]);
      g.beginPath(); g.moveTo(230, 20); g.lineTo(230, 440); g.moveTo(20, 230); g.lineTo(440, 230); g.stroke(); g.setLineDash([]);
      g.fillStyle = p.stick ? 'rgba(90,60,30,.22)' : 'rgba(40,30,25,.16)';
      g.font = `340px ${font}`; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(chars[ci].c, 230, 245);
      F.body.querySelector('.trace-char').textContent = chars[ci].c;
      F.body.querySelector('.trace-read').textContent = chars[ci].r;
      F.body.querySelector('.trace-prog').textContent = `${ci + 1} / ${chars.length}`;
    }
    setup();
    const pos = e => { const r = cu.getBoundingClientRect(); return { x: (e.clientX - r.left) * 460 / r.width, y: (e.clientY - r.top) * 460 / r.height }; };
    cu.onpointerdown = e => { drawing = true; (()=>{try{cu.setPointerCapture(e.pointerId)}catch(_){}})(); last = pos(e); dot(last, 13); };
    cu.onpointermove = e => { if (!drawing) return; const q = pos(e); const d = Math.hypot(q.x - last.x, q.y - last.y); const w = Math.max(9, 20 - d * .35); u.strokeStyle = p.stick ? '#5a3a1c' : '#17120f'; u.lineCap = 'round'; u.lineJoin = 'round'; u.lineWidth = w; u.beginPath(); u.moveTo(last.x, last.y); u.lineTo(q.x, q.y); u.stroke(); inkUsed += d; if (Math.random() < .08) SND.sfx('brush'); last = q; };
    cu.onpointerup = cu.onpointercancel = () => { drawing = false; };
    function dot(q, r) { u.fillStyle = p.stick ? '#5a3a1c' : '#17120f'; u.beginPath(); u.arc(q.x, q.y, r, 0, 7); u.fill(); }
    function evaluate() {
      const tmp = document.createElement('canvas'); tmp.width = tmp.height = 460; const t = tmp.getContext('2d');
      t.font = `340px ${font}`; t.textAlign = 'center'; t.textBaseline = 'middle'; t.fillStyle = '#000'; t.fillText(chars[ci].c, 230, 245);
      const gd = t.getImageData(0, 0, 460, 460).data;
      t.lineWidth = 34; t.strokeStyle = '#000'; t.strokeText(chars[ci].c, 230, 245);
      const gw = t.getImageData(0, 0, 460, 460).data;
      const ud = u.getImageData(0, 0, 460, 460).data;
      let gl = 0, cov = 0, ink = 0, inside = 0;
      for (let y = 0; y < 460; y += 4) for (let x = 0; x < 460; x += 4) {
        const k = (y * 460 + x) * 4 + 3;
        if (gd[k] > 100) { gl++; if (ud[k] > 50) cov++; }
        if (ud[k] > 50) { ink++; if (gw[k] > 50) inside++; }
      }
      const c = gl ? cov / gl : 0, pr = ink ? inside / ink : 0;
      return Math.max(0, Math.min(1, (c * 1.25) * .7 + pr * .3));
    }
    F.foot.querySelector('.btn-sub').onclick = () => { SND.sfx('click'); setup(); };
    F.foot.querySelector('.btn-main').onclick = () => {
      SND.sfx('click');
      const sc = inkUsed < 40 ? 0 : evaluate(); scores.push(sc);
      const grade = sc > .8 ? '참 잘 썼구나!' : sc > .55 ? '제법이구나.' : sc > .3 ? '조금 더 연습하자.' : '획을 따라 다시 써 보거라.';
      const tip = $(`<div class="trace-grade">${grade}</div>`); F.body.querySelector('.trace-paper').appendChild(tip);
      later(() => { tip.remove(); ci++; if (ci >= chars.length) { const avg = scores.reduce((a, b) => a + b, 0) / scores.length; finish(F, avg, avg > .6 ? '훈장님이 붉은 먹으로 동그라미를 쳐 주었다.' : '먹물 범벅이 되었지만, 글자가 조금씩 손에 익었다.', done); } else setup(); }, 1100);
    };
  }

  /* ---------- 3. 짝 맞추기 / 순서 배열 (드래그 또는 눌러서 놓기) ---------- */
  const STORY_PIC = {
    ga: `<svg viewBox="0 0 200 140"><rect width="200" height="140" fill="#efe4c8"/><path d="M20 60 L60 30 L120 30 L160 60Z" fill="none" stroke="#3a2a1a" stroke-width="3"/><rect x="40" y="60" width="100" height="60" fill="none" stroke="#3a2a1a" stroke-width="3"/><circle cx="80" cy="82" r="7" fill="none" stroke="#3a2a1a" stroke-width="2.5"/><path d="M80 89 V108 M70 96 H90 M80 108 L72 120 M80 108 L88 120" stroke="#3a2a1a" stroke-width="2.5"/><circle cx="150" cy="96" r="7" fill="none" stroke="#3a2a1a" stroke-width="2.5"/><path d="M150 103 Q146 112 140 120 H160 Q156 112 150 103 M140 108 L130 100" stroke="#3a2a1a" stroke-width="2.5" fill="none"/></svg>`,
    na: `<svg viewBox="0 0 200 140"><rect width="200" height="140" fill="#efe4c8"/><path d="M10 120 Q60 110 100 118 T190 115" stroke="#3a2a1a" stroke-width="2" fill="none"/><circle cx="55" cy="58" r="8" fill="none" stroke="#3a2a1a" stroke-width="2.5"/><path d="M55 66 V92 M55 92 L45 112 M55 92 L66 112 M55 74 L76 60" stroke="#3a2a1a" stroke-width="2.5"/><path d="M76 60 L84 40 M78 40 L92 46 L86 52Z" stroke="#3a2a1a" stroke-width="2.5" fill="#3a2a1a"/><path d="M110 98 Q125 76 160 80 Q182 82 186 98 L180 112 M118 104 L116 116 M140 106 L140 118 M168 104 L170 116" stroke="#3a2a1a" stroke-width="2.5" fill="none"/><path d="M110 98 Q100 92 104 84 Q110 80 116 86" stroke="#3a2a1a" stroke-width="2.5" fill="none"/><path d="M130 84 l4 12 M146 82 l2 12 M160 84 l-2 12" stroke="#3a2a1a" stroke-width="2"/><path d="M30 30 l6 20 M40 24 l4 26 M160 30 l-4 22" stroke="#6a8a4a" stroke-width="2"/></svg>`,
    da: `<svg viewBox="0 0 200 140"><rect width="200" height="140" fill="#efe4c8"/><ellipse cx="70" cy="100" rx="46" ry="22" fill="none" stroke="#3a2a1a" stroke-width="3"/><path d="M130 110 L130 70 L160 50 L190 70 L190 110Z" fill="none" stroke="#3a2a1a" stroke-width="2.5"/><circle cx="160" cy="88" r="6" fill="none" stroke="#3a2a1a" stroke-width="2.2"/><path d="M160 94 V108 M152 100 H168" stroke="#3a2a1a" stroke-width="2.2"/><text x="20" y="34" font-size="16" fill="#3a2a1a" font-family="serif">三年</text></svg>`,
    ra: `<svg viewBox="0 0 200 140"><rect width="200" height="140" fill="#efe4c8"/><path d="M20 110 H120" stroke="#3a2a1a" stroke-width="3"/><circle cx="34" cy="100" r="8" fill="none" stroke="#3a2a1a" stroke-width="2.5"/><path d="M42 104 Q80 96 116 104" stroke="#3a2a1a" stroke-width="2.5" fill="none"/><path d="M110 70 Q140 30 180 50 Q190 70 170 80 Q150 90 120 82Z" fill="#fff8e8" stroke="#3a2a1a" stroke-width="2" stroke-dasharray="4 3"/><circle cx="150" cy="56" r="7" fill="none" stroke="#3a2a1a" stroke-width="2.2"/><path d="M150 63 V76 M142 68 H158" stroke="#3a2a1a" stroke-width="2.2"/><path d="M60 80 q4 -8 8 0 q4 -8 8 0" stroke="#3a2a1a" stroke-width="1.6" fill="none"/></svg>`
  };
  function slots(p, S, done) {
    const rounds = p.rounds; let ri = 0, totalErr = 0, totalN = 0;
    const F = frame(rounds[0].title, '조각을 끌어다 알맞은 칸에 놓으세요. (조각을 누른 뒤 칸을 눌러도 돼요)');
    function round() {
      const R = rounds[ri];
      F.head.querySelector('.mg-title').textContent = R.title;
      const n = R.items.length; totalN += n;
      let targets;
      if (R.mode === 'order') targets = R.items.map((it, i) => ({ id: it.id, label: `${i + 1}`, num: true }));
      else targets = R.targets;
      const items = shuffle(R.items);
      F.body.innerHTML = `<div class="slots-wrap ${R.mode} ${R.story ? 'story' : ''}"><div class="slots-targets">${targets.map(t => `<div class="slot" data-id="${t.id}"><div class="slot-label">${t.num ? `<span class="slot-num">${R.story ? '가나다라'[+t.label - 1] : t.label}</span>` : t.label}</div><div class="slot-drop"></div></div>`).join('')}</div><div class="slots-pool">${items.map(it => `<div class="chip ${it.big ? 'big' : ''} ${it.pic ? 'pic' : ''}" data-id="${it.id}">${it.pic ? STORY_PIC[it.pic] : ''}<span>${it.label}</span></div>`).join('')}</div></div>`;
      let sel = null, placed = 0;
      const place = (chip, slot) => {
        if (!slot || slot.classList.contains('filled')) { chip.classList.remove('drag'); return; }
        if (chip.dataset.id === slot.dataset.id) {
          slot.querySelector('.slot-drop').appendChild(chip); chip.classList.remove('drag', 'sel'); chip.classList.add('done'); slot.classList.add('filled', 'flash'); SND.sfx('up'); placed++;
          if (placed >= n) later(() => { ri++; if (ri < rounds.length) round(); else finish(F, Math.max(0, 1 - totalErr / (totalN * .9)), totalErr === 0 ? '하나도 틀리지 않았다!' : `${totalErr}번 헷갈렸지만 끝까지 맞췄다.`, done); }, 800);
        } else { totalErr++; slot.classList.add('shake'); chip.classList.add('shake'); SND.sfx('down'); later(() => { slot.classList.remove('shake'); chip.classList.remove('shake'); }, 500); }
      };
      F.body.querySelectorAll('.chip').forEach(chip => {
        let ghost = null, start = null, moved = false;
        chip.onpointerdown = e => {
          if (chip.classList.contains('done')) return;
          e.preventDefault(); start = stagePt(e); moved = false; (()=>{try{chip.setPointerCapture(e.pointerId)}catch(_){}})();
        };
        chip.onpointermove = e => {
          if (!start) return; const q = stagePt(e);
          if (!moved && Math.hypot(q.x - start.x, q.y - start.y) > 8) {
            moved = true; ghost = chip.cloneNode(true); ghost.classList.add('ghost');
            const r = chip.getBoundingClientRect(), sr = document.getElementById('stage').getBoundingClientRect(), s = sr.width / 1600;
            ghost.style.width = r.width / s + 'px'; document.getElementById('stage').appendChild(ghost); chip.classList.add('drag');
          }
          if (ghost) { ghost.style.left = (q.x - ghost.offsetWidth / 2) + 'px'; ghost.style.top = (q.y - ghost.offsetHeight / 2) + 'px'; }
        };

          if (!start) return; start = null;
          if (moved && ghost) {

            const el = document.elementFromPoint(e.clientX, e.clientY);

          } else {
            F.body.querySelectorAll('.chip').forEach(c => c.classList.remove('sel'));
            if (sel === chip) sel = null; else { sel = chip; chip.classList.add('sel'); SND.sfx('click'); }
          }
        };
        chip.onpointerup = up; chip.onpointercancel = () => { if (ghost) { ghost.remove(); ghost = null; } start = null; chip.classList.remove('drag'); };
      });
      F.body.querySelectorAll('.slot').forEach(slot => slot.onclick = () => { if (sel) { const c = sel; sel = null; place(c, slot); } });
    }
    round();
  }

  /* ---------- 4. 고르기 퀴즈 / 시험 ---------- */
  const EXAM_POOL = [
    { q: '유교의 네 덕목 가운데 "옳을 의"는?', opts: ['仁', '義', '禮', '智'], a: 1 },
    { q: '유교의 네 덕목 가운데 "지혜 지"는?', opts: ['仁', '義', '禮', '智'], a: 3 },
    { q: '부모에 대해 지켜야 할 도리는?', opts: ['충성', '효도', '질서', '믿음'], a: 1 },
    { q: '친구 사이에 지켜야 할 도리는?', opts: ['충성', '효도', '질서', '믿음'], a: 3 },
    { q: '임금에 대해 지켜야 할 도리는?', opts: ['충성', '효도', '질서', '믿음'], a: 0 },
    { q: '숭례문의 이름에 담긴 덕목은?', opts: ['어질 인(仁)', '옳을 의(義)', '예도 예(禮)', '지혜 지(智)'], a: 2 },
    { q: '나라에서 세운 조선 최고의 교육 기관은?', opts: ['서당', '향교', '성균관', '집현전'], a: 2 },
    { q: '고려의 장군이었다가 조선을 세운 임금은?', opts: ['태조', '정종', '태종', '세종'], a: 0 },
    { q: '왕자의 난을 거쳐 왕이 되어 강한 왕권을 세운 임금은?', opts: ['태조', '정종', '태종', '세조'], a: 2 },
    { q: '경국대전을 완성한 임금은?', opts: ['태조', '세종', '세조', '성종'], a: 3 },
    { q: '경국대전에 따르면 남자가 혼인할 수 있는 나이는?', opts: ['12세', '14세', '15세', '20세'], a: 2 },
    { q: '관혼상제 가운데 "관례"는 무엇인가?', opts: ['성인식', '결혼', '장례', '제사'], a: 0 },
    { q: '태정태세문단세 — "문" 다음에 오는 임금은?', opts: ['세조', '단종', '예종', '성종'], a: 1 }
  ];
  function pick(p, S, done, examMode) {
    const multi = p.multi;
    const qs = examMode ? shuffle(EXAM_POOL).slice(0, 6) : p.qs;
    const F = frame(examMode ? '과거 시험' : multi ? '알맞은 것 고르기' : '문제', examMode ? `제한 시간 안에 답을 고르세요. 학식이 높을수록 유리합니다.` : multi ? `${p.need}개를 고른 뒤 '답 올리기'를 누르세요.` : '알맞은 답을 고르세요.', examMode ? 'exam' : '');
    if (multi) {
      F.body.innerHTML = `<div class="pick-q">${p.q}</div><div class="pick-opts multi">${p.opts.map((o, i) => `<button class="opt" data-i="${i}">${o}</button>`).join('')}</div>`;
      F.foot.innerHTML = `<button class="btn-main" disabled>답 올리기</button>`;
      const chosen = new Set(); const btn = F.foot.querySelector('button');
      F.body.querySelectorAll('.opt').forEach(b => b.onclick = () => { const i = +b.dataset.i; SND.sfx('click'); if (chosen.has(i)) { chosen.delete(i); b.classList.remove('sel'); } else if (chosen.size < p.need) { chosen.add(i); b.classList.add('sel'); } btn.disabled = chosen.size !== p.need; });
      btn.onclick = () => { const ok = [...chosen].filter(i => p.correct.includes(i)).length; F.body.querySelectorAll('.opt').forEach(b => { const i = +b.dataset.i; if (p.correct.includes(i)) b.classList.add('good'); else if (chosen.has(i)) b.classList.add('bad'); }); later(() => finish(F, ok / p.need, `${p.need}개 중 ${ok}개를 맞혔다.`, done), 1300); };
      return;
    }
    let i = 0, right = 0, timeLeft = p.time || 0, tInt = null;
    F.body.innerHTML = `${examMode ? '<div class="exam-timer"><div class="bar"></div><span></span></div>' : ''}<div class="pick-q"></div><div class="pick-opts"></div><div class="pick-prog"></div>`;
    const show = () => {
      const q = qs[i];
      F.body.querySelector('.pick-q').textContent = q.q;
      F.body.querySelector('.pick-prog').textContent = `${i + 1} / ${qs.length}`;
      const box = F.body.querySelector('.pick-opts');
      box.innerHTML = q.opts.map((o, k) => `<button class="opt" data-k="${k}">${o}</button>`).join('');
      box.querySelectorAll('.opt').forEach(b => b.onclick = () => {
        if (box.classList.contains('lock')) return; box.classList.add('lock');
        const k = +b.dataset.k;
        if (k === q.a) { right++; b.classList.add('good'); SND.sfx('up'); } else { b.classList.add('bad'); box.querySelector(`[data-k="${q.a}"]`).classList.add('good'); SND.sfx('down'); }
        later(() => { box.classList.remove('lock'); i++; if (i >= qs.length) end(); else show(); }, examMode ? 700 : 1100);
      });
    };
    const end = () => { if (tInt) clearInterval(tInt); finish(F, right / qs.length, `${qs.length}문제 중 ${right}문제를 맞혔다.`, done); };
    show();
    if (examMode) {
      const total = timeLeft; const bar = F.body.querySelector('.exam-timer .bar'), lab = F.body.querySelector('.exam-timer span');
      tInt = setInterval(() => { timeLeft--; bar.style.width = (timeLeft / total * 100) + '%'; lab.textContent = `남은 시간 ${timeLeft}초`; if (timeLeft <= 10) SND.sfx('tick'); if (timeLeft <= 0) { clearInterval(tInt); end(); } }, 1000);
      timers.push(tInt);
      lab.textContent = `남은 시간 ${timeLeft}초`;
    }
  }

  /* ---------- 5. 가위바위보 ---------- */
  const HAND = {

    2: `<svg viewBox="0 0 100 100"><path d="M28 92 V54 Q28 46 36 46 H64 Q72 46 72 54 V92Z" fill="#e6bc95" stroke="#7a4a2a" stroke-width="3"/>${[22, 38, 54, 70].map((x, i) => `<path d="M${36 + i * 9} 48 L${x + 6} ${12 + Math.abs(i - 1.5) * 6}" stroke="#e6bc95" stroke-width="11" stroke-linecap="round"/>`).join('')}<path d="M28 60 L12 44" stroke="#e6bc95" stroke-width="11" stroke-linecap="round"/></svg>`
  };
  const HN = ['가위', '바위', '보'];
  function rps(p, S, done) {
    const F = frame('장터 내기 · 가위바위보', p.need === 'win' ? '내기꾼을 <b>이기면</b> 성공! 비기면 실패예요.' : '이번엔 내기꾼에게 <b>지면</b> 성공! 비기면 실패예요.');
    F.body.innerHTML = `<div class="rps"><div class="rps-side"><div class="rps-who">내기꾼</div><div class="rps-hand them">?</div></div><div class="rps-vs">VS</div><div class="rps-side"><div class="rps-who">나</div><div class="rps-hand me">?</div></div></div><div class="rps-call"></div><div class="rps-btns">${[0, 1, 2].map(k => `<button class="rps-b" data-k="${k}">${HAND[k]}<span>${HN[k]}</span></button>`).join('')}</div>`;
    F.body.querySelectorAll('.rps-b').forEach(b => b.onclick = () => {
      if (F.body.classList.contains('lock')) return; F.body.classList.add('lock');
      const me = +b.dataset.k, them = Math.floor(Math.random() * 3);
      const call = F.body.querySelector('.rps-call');
      F.body.querySelector('.me').innerHTML = HAND[me];
      ['가위!', '바위!', '보!'].forEach((w, i) => later(() => { call.textContent = w; SND.sfx('tick'); F.body.querySelector('.them').innerHTML = HAND[i]; }, i * 380));
      later(() => {
        F.body.querySelector('.them').innerHTML = HAND[them];
        const r = (me - them + 3) % 3; // 1 이김, 2 짐, 0 비김
        const ok = p.need === 'win' ? r === 1 : r === 2;
        call.textContent = r === 0 ? '비겼다!' : r === 1 ? '내가 이겼다!' : '내가 졌다!';
        later(() => finish(F, ok ? 1 : 0, ok ? '내기꾼이 혀를 찼다.' : '내기꾼이 껄껄 웃었다.', done), 1000);
      }, 1250);
    });
  }

  /* ---------- 6. 장터 장사 ---------- */
  function trade(p, S, done) {
    const F = frame('장날 세 번의 장사', '값이 쌀 때 사고 비쌀 때 파세요. 소문을 잘 들으면 이익이 커져요.');
    const days = 3; let day = 0; let cash = p.cash; const inv = {}; p.goods.forEach(g => inv[g.id] = (p.stock && p.stock[g.id]) || 0);
    const startVal = p.cash + p.goods.reduce((a, g) => a + inv[g.id] * g.base, 0);
    const prices = []; for (let d = 0; d <= days; d++) { const row = {}; p.goods.forEach(g => row[g.id] = Math.max(2, Math.round(g.base * (0.6 + Math.random() * 0.9)))); prices.push(row); }
    function rumor() {
      if (day >= days - 1) return '오늘이 마지막 장날이다. 남은 물건은 헐값에 넘겨야 한다.';
      const g = p.goods[Math.floor(Math.random() * p.goods.length)];
      const up = prices[day + 1][g.id] > prices[day][g.id];
      const truth = Math.random() < .8 ? up : !up;
      return `소문: "다음 장날엔 ${g.n} 값이 ${truth ? '오른다' : '내린다'}더라."`;
    }
    function render() {
      const P = prices[day];
      F.body.innerHTML = `<div class="trade"><div class="trade-top"><div class="trade-day">${['첫째', '둘째', '셋째'][day]} 장날</div><div class="trade-cash">가진 돈 <b>${cash}</b>냥</div></div><div class="trade-rumor">${rumor()}</div><div class="trade-rows">${p.goods.map(g => `<div class="trade-row" data-id="${g.id}"><div class="tg-name">${g.n}</div><div class="tg-price">${P[g.id]}냥 ${day > 0 ? (P[g.id] > prices[day - 1][g.id] ? '<i class="up">▲</i>' : P[g.id] < prices[day - 1][g.id] ? '<i class="dn">▼</i>' : '') : ''}</div><div class="tg-inv">가진 것 <b>${inv[g.id]}</b></div><button class="btn-sm buy">사기</button><button class="btn-sm sell">팔기</button></div>`).join('')}</div></div>`;
      F.foot.innerHTML = `<button class="btn-main">${day < days - 1 ? '다음 장날로' : '장사 마치기'}</button>`;
      F.body.querySelectorAll('.trade-row').forEach(r => {
        const id = r.dataset.id;
        r.querySelector('.buy').onclick = () => { if (cash >= P[id]) { cash -= P[id]; inv[id]++; SND.sfx('coin'); render(); } else SND.sfx('down'); };
        r.querySelector('.sell').onclick = () => { if (inv[id] > 0) { cash += P[id]; inv[id]--; SND.sfx('coin'); render(); } else SND.sfx('down'); };
      });
      F.foot.querySelector('button').onclick = () => {
        SND.sfx('click');
        if (day < days - 1) { day++; render(); }
        else {
          let rest = 0; p.goods.forEach(g => { rest += Math.floor(inv[g.id] * P[g.id] * .6); });
          const final = cash + rest; const profit = final - startVal;
          finish(F, Math.max(0, Math.min(1, .5 + profit / (p.cash * .8))), `장사를 마쳤다. ${profit >= 0 ? profit + '냥 이익' : (-profit) + '냥 손해'}.`, done, { profit });
        }
      };
    }
    render();
  }

  /* ---------- 7. 배분 ---------- */
  function alloc(p, S, done) {
    const F = frame(p.title, `가진 ${p.total}${p.unit}을(를) 나누세요. 꼭 필요한 만큼 채우는 것이 중요해요.`);
    const v = {}; p.rows.forEach(r => v[r.id] = 0);
    function left() { return p.total - Object.values(v).reduce((a, b) => a + b, 0); }
    const step = p.total >= 50 ? 5 : 1;
    function render() {
      F.body.innerHTML = `<div class="alloc"><div class="alloc-left">남은 것 <b>${left()}</b>${p.unit}</div>${p.rows.map(r => `<div class="alloc-row" data-id="${r.id}"><div class="ar-name">${r.label}<small>${r.tip}${r.need ? ` · 필요 ${r.need}${p.unit}` : ''}</small></div><div class="ar-bar"><div class="ar-fill ${r.need && v[r.id] >= r.need ? 'ok' : ''}" style="width:${Math.min(100, v[r.id] / Math.max(1, r.need || p.total * .3) * 100)}%"></div></div><button class="btn-sm minus">−</button><div class="ar-val">${v[r.id]}</div><button class="btn-sm plus">+</button></div>`).join('')}</div>`;
      F.foot.innerHTML = `<button class="btn-main">이대로 정한다</button>`;
      F.body.querySelectorAll('.alloc-row').forEach(row => {
        const id = row.dataset.id;
        row.querySelector('.minus').onclick = () => { if (v[id] >= step) { v[id] -= step; SND.sfx('click'); render(); } };
        row.querySelector('.plus').onclick = () => { if (left() >= step) { v[id] += step; SND.sfx('click'); render(); } else SND.sfx('down'); };
      });
      F.foot.querySelector('button').onclick = () => {
        const lf = left(); const saveRow = p.rows.find(r => r.id === 'save'); if (lf > 0 && saveRow) v.save += lf;
        let num = 0, den = 0;
        p.rows.forEach(r => { if (r.need) { const w = (r.id === 'eat' || r.id === 'rice') ? 2 : 1; num += w * Math.min(1, v[r.id] / r.need); den += w; } });
        const sc = den ? num / den : 1;
        finish(F, sc, sc > .9 ? '꼭 필요한 곳에 빠짐없이 나누었다.' : sc > .6 ? '조금 모자란 곳이 있었다.' : '모자란 곳이 너무 많았다.', done, Object.assign({}, v));
      };
    }
    render();
  }

  /* ---------- 8. 업무 분류 ---------- */
  const BIN_CARDS = [
    { t: '열이 펄펄 끓는 아이를 살펴 주시오', b: 'ui' }, { t: '역병이 도는 마을에 약을 보내야 하오', b: 'ui' }, { t: '임금님께 올릴 탕약을 달이시오', b: 'ui' }, { t: '다친 군사의 상처를 치료해 주시오', b: 'ui' },
    { t: '명나라 사신의 말을 옮겨 주시오', b: 'yeok' }, { t: '일본에서 온 외교 문서를 풀이하시오', b: 'yeok' }, { t: '중국말로 된 책을 우리말로 옮기시오', b: 'yeok' }, { t: '왜인 상인과의 거래를 통역해 주시오', b: 'yeok' },
    { t: '이웃끼리 땅 경계 다툼이 났소', b: 'yul' }, { t: '도둑의 죄를 법에 따라 따져 주시오', b: 'yul' }, { t: '억울하게 옥에 갇혔다는 호소가 왔소', b: 'yul' }, { t: '경국대전의 조문을 찾아 주시오', b: 'yul' }
  ];
  function bins(p, S, done) {
    const F = frame(p.short ? '양반 관리의 문서 나누기' : '전문가에게 일 나누기', '들어온 일을 알맞은 전문가에게 보내세요. 카드를 끌어다 놓거나, 아래 칸을 눌러도 돼요.');
    const B = [{ id: 'ui', n: '의관', s: '의학 · 전의감' }, { id: 'yeok', n: '역관', s: '통역 · 사역원' }, { id: 'yul', n: '율관', s: '법률 · 형조' }];
    const deck = shuffle(BIN_CARDS.concat(shuffle(BIN_CARDS).slice(0, 6)));
    let i = 0, right = 0, seen = 0, t = p.time;
    F.body.innerHTML = `<div class="bins"><div class="exam-timer"><div class="bar"></div><span></span></div><div class="bins-card-zone"></div><div class="bins-row">${B.map(b => `<button class="bin" data-id="${b.id}"><b>${b.n}</b><small>${b.s}</small><i class="cnt">0</i></button>`).join('')}</div><div class="bins-score">처리한 일 0</div></div>`;
    const zone = F.body.querySelector('.bins-card-zone');
    const cnt = { ui: 0, yeok: 0, yul: 0 };
    function nextCard() {
      zone.innerHTML = `<div class="bcard">${deck[i % deck.length].t}</div>`;
      const c = zone.firstChild; let st = null, gh = null;
      c.onpointerdown = e => { e.preventDefault(); st = stagePt(e); (()=>{try{c.setPointerCapture(e.pointerId)}catch(_){}})(); };
      c.onpointermove = e => { if (!st) return; const q = stagePt(e); c.style.transform = `translate(${q.x - st.x}px,${q.y - st.y}px) rotate(${(q.x - st.x) / 30}deg)`; };
      c.onpointerup = e => { if (!st) return; st = null; c.style.visibility = 'hidden'; const el = document.elementFromPoint(e.clientX, e.clientY); c.style.visibility = ''; const bin = el && el.closest('.bin'); if (bin) answer(bin.dataset.id); else c.style.transform = ''; };
    }
    function answer(id) {
      const card = deck[i % deck.length]; seen++;
      const binEl = F.body.querySelector(`.bin[data-id="${id}"]`);
      if (card.b === id) { right++; cnt[id]++; binEl.querySelector('.cnt').textContent = cnt[id]; binEl.classList.add('flash'); SND.sfx('up'); }
      else { binEl.classList.add('shake'); SND.sfx('down'); }
      later(() => binEl.classList.remove('flash', 'shake'), 400);
      F.body.querySelector('.bins-score').textContent = `처리한 일 ${right} / ${seen}`;
      i++; nextCard();
    }
    F.body.querySelectorAll('.bin').forEach(b => b.onclick = () => answer(b.dataset.id));
    nextCard();
    const bar = F.body.querySelector('.bar'), lab = F.body.querySelector('.exam-timer span');
    lab.textContent = `남은 시간 ${t}초`;
    const iv = setInterval(() => { t--; bar.style.width = (t / p.time * 100) + '%'; lab.textContent = `남은 시간 ${t}초`; if (t <= 0) { clearInterval(iv); const target = p.short ? 8 : 12; const sc = Math.min(1, right / target) * (seen ? (right / seen) : 0) ** .5; finish(F, sc, `${seen}건 중 ${right}건을 바르게 처리했다.`, done); } }, 1000);
    timers.push(iv);
  }

  /* ---------- 9. 리듬 / 활쏘기 ---------- */
  function rhythm(p, S, done) {
    const label = typeof p.label === 'function' ? p.label(S) : p.label;
    const F = frame(label, p.archery ? '움직이는 표시가 과녁 가운데(붉은 칸)에 올 때 "쏘기!"를 누르세요.' : '움직이는 표시가 붉은 칸에 들어올 때 누르세요. 박자를 맞춰야 일이 빨리 끝나요.');
    F.body.innerHTML = `<div class="rhy"><div class="rhy-art">${p.archery ? `<svg viewBox="0 0 200 120"><circle cx="160" cy="60" r="44" fill="#f4ecd8" stroke="#222" stroke-width="3"/><circle cx="160" cy="60" r="30" fill="#2f4a7a"/><circle cx="160" cy="60" r="16" fill="#c23b3b"/><path d="M10 60 H90" stroke="#5a3826" stroke-width="5"/><path d="M90 60 l-12 -8 v16Z" fill="#555"/></svg>` : label === '다듬이질' ? `<svg viewBox="0 0 200 120"><rect x="30" y="70" width="140" height="30" rx="6" fill="#b8a888"/><rect x="40" y="56" width="120" height="16" fill="#efe6d0"/><g class="rhy-stick"><rect x="60" y="20" width="20" height="40" rx="8" fill="#7a5432"/><rect x="120" y="20" width="20" height="40" rx="8" fill="#7a5432"/></g></svg>` : `<svg viewBox="0 0 200 120"><ellipse cx="100" cy="72" rx="40" ry="28" fill="#c9a85e"/><path d="M70 60 Q100 40 130 60 M66 74 Q100 54 134 74 M70 88 Q100 68 130 88" stroke="#8a6f34" stroke-width="3" fill="none"/><g class="rhy-stick"><path d="M150 20 L120 60" stroke="#6b4a2a" stroke-width="7"/></g></svg>`}</div><div class="rhy-track"><div class="rhy-zone"></div><div class="rhy-mark"></div></div><div class="rhy-info"><span class="rhy-hits">0</span> / ${p.beats}</div></div>`;
    F.foot.innerHTML = `<button class="btn-main big">${p.archery ? '쏘기!' : '탁!'}</button>`;
    const track = F.body.querySelector('.rhy-track'), mark = F.body.querySelector('.rhy-mark'), zone = F.body.querySelector('.rhy-zone');
    let pos = 0, dir = 1, speed = .55, beat = 0, hits = 0, raf, zl = 40, zw = 16, last = performance.now(), active = true;
    function newZone() { zw = Math.max(9, 16 - beat * .6); zl = 10 + Math.random() * (80 - zw); zone.style.left = zl + '%'; zone.style.width = zw + '%'; }
    newZone();
    function loop(now) { const dt = Math.min(50, now - last); last = now; pos += dir * speed * dt / 10; if (pos > 100) { pos = 100; dir = -1; } if (pos < 0) { pos = 0; dir = 1; } mark.style.left = pos + '%'; raf = requestAnimationFrame(loop); }
    raf = requestAnimationFrame(loop);
    const press = () => {
      if (!active) return;
      const ok = pos >= zl - 1 && pos <= zl + zw + 1;
      beat++; if (ok) { hits++; SND.sfx('up'); track.classList.add('hit'); } else { SND.sfx('down'); track.classList.add('miss'); }
      const st = F.body.querySelector('.rhy-stick'); if (st) { st.classList.remove('hitanim'); void st.offsetWidth; st.classList.add('hitanim'); }
      later(() => track.classList.remove('hit', 'miss'), 250);
      F.body.querySelector('.rhy-hits').textContent = hits;
      speed += .07; newZone();
      if (beat >= p.beats) { active = false; cancelAnimationFrame(raf); later(() => finish(F, hits / p.beats, `${p.beats}번 중 ${hits}번 박자를 맞혔다.`, done), 500); }
    };
    F.foot.querySelector('button').onpointerdown = e => { e.preventDefault(); press(); };
    const key = e => { if (e.code === 'Space') { e.preventDefault(); press(); } };
    document.addEventListener('keydown', key);
    const oldFinish = done; done = (s, d) => { document.removeEventListener('keydown', key); cancelAnimationFrame(raf); oldFinish(s, d); };
  }

  /* ---------- 10. 조용히 행군하기 ---------- */
  function march(p, S, done) {
    const F = frame('조용히 행군하기', '"걷기" 버튼을 누르고 있으면 앞으로 걸어요. 군관이 뒤돌아보면 손을 떼세요! 너무 오래 누르면 뛰는 것이 되어 혼나요.');
    F.body.innerHTML = `<div class="march"><div class="march-field"><div class="march-officer"><svg viewBox="-80 -380 160 400" width="120" height="300">${ART.defs({ time: 'day' })}${ART.person({ st: 'yb', g: 'm', age: 'adult', married: true, official: 'red', x: 0, y: 0, s: .9 })}</svg><div class="march-eye">👀</div></div><div class="march-me"><svg viewBox="-80 -380 160 400" width="90" height="225">${ART.defs({ time: 'day' })}${ART.person({ st: 'sm', g: 'm', age: 'young', capped: true, x: 0, y: 0, s: .9, hold: 'bow' })}</svg></div><div class="march-flag">도착</div></div><div class="march-info"><span class="m-time">남은 시간 ${p.time}초</span><span class="m-strike">경고 ○○○</span><span class="m-run"></span></div></div>`;
    F.foot.innerHTML = `<button class="btn-main big hold">걷기 (누르고 있기)</button>`;
    const me = F.body.querySelector('.march-me'), off = F.body.querySelector('.march-officer'), eye = off.querySelector('.march-eye');
    let prog = 0, holding = false, holdT = 0, watching = false, warn = false, strikes = 0, t = p.time, ended = false, raf, last = performance.now();
    const btn = F.foot.querySelector('button');
    btn.onpointerdown = e => { e.preventDefault(); holding = true; holdT = 0; (()=>{try{btn.setPointerCapture(e.pointerId)}catch(_){}})(); };
    btn.onpointerup = btn.onpointercancel = () => { holding = false; holdT = 0; };
    function strike(why) { strikes++; SND.sfx('fail'); F.body.querySelector('.m-strike').textContent = '경고 ' + '●'.repeat(strikes) + '○'.repeat(Math.max(0, 3 - strikes)); F.body.querySelector('.m-run').textContent = why; me.classList.add('caught'); holding = false; later(() => { me.classList.remove('caught'); F.body.querySelector('.m-run').textContent = ''; }, 900); prog = Math.max(0, prog - 8); if (strikes >= 3) end(false); }
    function cycle() {
      if (ended) return;
      later(() => { if (ended) return; warn = true; eye.classList.add('warn'); SND.sfx('tick');
        later(() => { if (ended) return; warn = false; watching = true; off.classList.add('turn'); eye.classList.remove('warn');
          later(() => { watching = false; off.classList.remove('turn'); cycle(); }, 1200 + Math.random() * 1000); }, 700); }, 1500 + Math.random() * 2200);
    }
    cycle();
    function loop(now) {
      const dt = Math.min(60, now - last); last = now;
      if (holding && !ended) {
        holdT += dt; prog += dt * .0105;
        me.classList.add('walk');
        if (watching) { strike('들켰다! 대열이 흐트러졌다.'); }
        else if (holdT > 2600) { strike('뛰었다! 행군 중에는 뛰면 안 된다.'); }
      } else me.classList.remove('walk');
      me.style.left = (6 + Math.min(100, prog) * .72) + '%';
      if (prog >= 100) end(true);
      if (!ended) raf = requestAnimationFrame(loop);
    }
    raf = requestAnimationFrame(loop);
    const iv = setInterval(() => { t--; F.body.querySelector('.m-time').textContent = `남은 시간 ${t}초`; if (t <= 0) end(prog >= 100); }, 1000);
    timers.push(iv);
    function end(ok) { if (ended) return; ended = true; clearInterval(iv); cancelAnimationFrame(raf); const sc = ok ? Math.max(.6, 1 - strikes * .15) : Math.min(.5, prog / 200); finish(F, sc, ok ? '대열을 지키며 끝까지 걸었다.' : strikes >= 3 ? '군관에게 세 번 들켜 벌을 받았다.' : '시간 안에 도착하지 못했다.', done); }
  }

  /* ---------- 11. 집안일 (치우기) ---------- */
  function clean(p, S, done) {
    const F = frame('집안일: 손님맞이 청소', '떨어진 지푸라기, 낙엽, 깨진 그릇 조각을 모두 눌러 치우세요.');
    F.body.innerHTML = `<div class="clean"><div class="clean-scene">${ART.scene({ place: 'yard', time: 'day', season: 'autumn', seed: 3 })}</div><div class="clean-info"><span class="c-left"></span><span class="c-time"></span></div></div>`;
    const sc = F.body.querySelector('.clean-scene');
    const kinds = [`<svg viewBox="0 0 60 30"><path d="M4 20 L56 8 M6 24 L54 14 M8 16 L50 22" stroke="#c9a85e" stroke-width="3"/></svg>`, `<svg viewBox="0 0 40 40"><path d="M20 4 Q34 14 30 30 Q20 36 10 30 Q6 14 20 4Z" fill="#c8642c"/><path d="M20 6 V34" stroke="#7a3a1a" stroke-width="2"/></svg>`, `<svg viewBox="0 0 40 30"><path d="M4 26 L14 6 L30 10 L36 26Z" fill="#6a4228"/><path d="M14 6 L20 18" stroke="#3a2618" stroke-width="2"/></svg>`];
    let left = p.count, t = p.time, ended = false;
    for (let i = 0; i < p.count; i++) {
      const b = $(`<button class="litter" style="left:${8 + Math.random() * 84}%;top:${70 + Math.random() * 24}%">${kinds[i % 3]}</button>`);
      b.onclick = () => { if (ended) return; b.classList.add('gone'); SND.sfx('up'); left--; upd(); if (left <= 0) end(); };
      sc.appendChild(b);
    }
    const upd = () => { F.body.querySelector('.c-left').textContent = `남은 것 ${left}개`; F.body.querySelector('.c-time').textContent = `남은 시간 ${t}초`; };
    upd();
    const iv = setInterval(() => { t--; upd(); if (t <= 0) end(); }, 1000); timers.push(iv);
    function end() { if (ended) return; ended = true; clearInterval(iv); finish(F, (p.count - left) / p.count, left ? `${left}개를 미처 못 치웠다.` : '마당이 깨끗해졌다.', done); }
  }

  function run(type, p, S, done) {
    SND.mood('game');
    const fns = { find, trace, slots, pick, rps, trade, alloc, bins, rhythm, march, clean, exam: (p, S, d) => pick(p, S, d, true) };
    (fns[type] || ((p, S, d) => d(1, {})))(p || {}, S, done);
  }
  return { run, clearAll };
})();

/* ===================== ENGINE ===================== */
const GAME = (() => {

  const FX = (() => {

    function set(t) {
      if (t === type) return; type = t; parts = [];
      const n = { rain: 220, snow: 140, petal: 46, leaf: 34, firefly: 40, ember: 70, dust: 30 }[t] || 0;
      for (let i = 0; i < n; i++) parts.push(spawn(true));

    function spawn(init) {
      const p = { x: Math.random() * 1600, y: init ? Math.random() * 900 : -20, s: Math.random() };
      if (type === 'firefly' || type === 'dust') p.y = 200 + Math.random() * 650;
      if (type === 'ember') p.y = init ? Math.random() * 900 : 920;

    }
    function loop() {
      raf = requestAnimationFrame(loop);
      if (!cx) return; cx.clearRect(0, 0, 1600, 900);

      parts.forEach((p, i) => {
        if (type === 'rain') { p.y += 26 + p.s * 14; p.x -= 6; cx.strokeStyle = `rgba(200,215,230,${.25 + p.s * .3})`; cx.lineWidth = 1.2; cx.beginPath(); cx.moveTo(p.x, p.y); cx.lineTo(p.x + 5, p.y - 22); cx.stroke(); }
        else if (type === 'snow') { p.y += 1 + p.s * 1.6; p.x += Math.sin(t + i) * .6; cx.fillStyle = `rgba(255,255,255,${.6 + p.s * .4})`; cx.beginPath(); cx.arc(p.x, p.y, 1.5 + p.s * 2.8, 0, 7); cx.fill(); }
        else if (type === 'petal') { p.y += .8 + p.s; p.x += 1.2 + Math.sin(t * 1.5 + i) * 1.2; cx.save(); cx.translate(p.x, p.y); cx.rotate(t * 2 + i); cx.fillStyle = `rgba(246,196,210,${.75})`; cx.beginPath(); cx.ellipse(0, 0, 6, 3.2, 0, 0, 7); cx.fill(); cx.restore(); }
        else if (type === 'leaf') { p.y += 1.2 + p.s; p.x += Math.sin(t + i) * 1.6 - .4; cx.save(); cx.translate(p.x, p.y); cx.rotate(t + i); cx.fillStyle = ['#c8642c', '#e0a13b', '#a8452a'][i % 3]; cx.beginPath(); cx.ellipse(0, 0, 8, 4, 0, 0, 7); cx.fill(); cx.restore(); }
        else if (type === 'firefly' || type === 'dust') { p.x += Math.sin(t * .7 + i) * .5; p.y += Math.cos(t * .5 + i * 2) * .4; const a = (Math.sin(t * 2 + i) + 1) / 2; cx.fillStyle = type === 'firefly' ? `rgba(255,224,140,${a * .9})` : `rgba(255,248,220,${a * .35})`; cx.beginPath(); cx.arc(p.x, p.y, type === 'firefly' ? 2.6 : 2, 0, 7); cx.fill(); if (type === 'firefly') { cx.fillStyle = `rgba(255,210,120,${a * .15})`; cx.beginPath(); cx.arc(p.x, p.y, 12, 0, 7); cx.fill(); } }
        else if (type === 'ember') { p.y -= 1.2 + p.s * 2; p.x += Math.sin(t * 2 + i) * 1; const a = .4 + p.s * .6; cx.fillStyle = `rgba(255,${120 + p.s * 80 | 0},40,${a})`; cx.beginPath(); cx.arc(p.x, p.y, 1.5 + p.s * 2, 0, 7); cx.fill(); }
