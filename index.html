      <div class="setup-top"><h2>어떤 삶으로 태어날까?</h2>
        <div class="setup-row"><label>이름</label><input id="nm" maxlength="6" placeholder="이름을 지어 주세요" autocomplete="off">
        <div class="gsel"><button class="on" data-g="m">남자</button><button data-g="f">여자</button></div>
        <span class="gnote">조선에서는 성별에 따라서도 삶이 크게 달랐어요.</span></div></div>
      <div class="cards">${['yb', 'ji', 'sm', 'cm'].map(k => `<button class="scard" data-st="${k}"><div class="sc-art"></div><div class="sc-name"><i>${INFO[k].h}</i>${INFO[k].t}</div><ul>${INFO[k].lines.map(l => `<li><em>${l[0]}</em>${l[1]}</li>`).join('')}</ul></button>`).join('')}</div>
      <div class="class-brace"><div class="cb-yang"><span>양인</span></div><div class="cb-cheon"><span>천인</span></div></div>
      <div class="setup-foot"><button class="btn-sub" data-a="back">처음으로</button><button class="btn-fate" data-a="fate">운명에 맡기기</button><button class="btn-main" data-a="go" disabled>이 신분으로 태어나기</button></div></div>`);
    $('#ui').innerHTML = ''; $('#ui').appendChild(U);
    showScene({ place: 'gate', time: 'dawn', season: 'spring' });
    const draw = () => U.querySelectorAll('.scard').forEach(c => { const k = c.dataset.st; c.querySelector('.sc-art').innerHTML = `<svg viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">${ART.scene({ place: INFO[k].bg, decor: k, time: 'day', season: 'spring', seed: 9, cast: [{ st: k, g, age: 'adult', married: true, capped: true, x: 800, y: 1080, s: 1.9, hold: INFO[k].hold, expr: 'neutral' }] }).replace(/^<svg[^>]*>/, '').replace(/<\/svg>$/, '')}</svg>`; });
    draw();
    const go = U.querySelector('[data-a="go"]');
    const pickC = k => { chosen = k; U.querySelectorAll('.scard').forEach(c => c.classList.toggle('sel', c.dataset.st === k)); go.disabled = false; };
    U.querySelectorAll('.scard').forEach(c => c.onclick = () => { SND.sfx('click'); pickC(c.dataset.st); });
    U.querySelectorAll('.gsel button').forEach(b => b.onclick = () => { SND.sfx('click'); g = b.dataset.g; U.querySelectorAll('.gsel button').forEach(x => x.classList.toggle('on', x === b)); draw(); });
    U.querySelector('[data-a="back"]').onclick = () => { SND.sfx('click'); titleScreen(); };
    U.querySelector('[data-a="fate"]').onclick = e => {
      const b = e.currentTarget; if (b.disabled) return; b.disabled = true; go.disabled = true;
      const ks = ['yb', 'ji', 'sm', 'cm']; const fin = ks[Math.floor(Math.random() * 4)];
      let n = 0, total = 14 + ks.indexOf(fin) + Math.floor(Math.random() * 2) * 4;
      while (ks[total % 4] !== fin) total++;
      const spin = () => { pickC(ks[n % 4]); SND.sfx('tick'); n++; if (n <= total) setTimeout(spin, 60 + n * n * .9); else { SND.sfx('success'); U.querySelector('.scard.sel').classList.add('fate'); b.disabled = false; go.disabled = false; } };
      spin();
    };
    go.onclick = () => {
      let name = U.querySelector('#nm').value.trim().replace(/[<>&"']/g, '');
      if (!name) name = pickName(g, Math.random());
      SND.sfx('click');
      S = newState(name, chosen, g); clearSave(); buildOrder(); save();
      startPlay(false);
    };
  }
  function startPlay(resume) {
    $('#ui').innerHTML = '';
    $('#hud').classList.add('on');
    hud();
    if (resume) { const ch = S.ch; S.ch = 0; if (ch) S.ch = 0; }
    nextEvent();
  }

  /* ---------- 엔딩: 인생 회고록 ---------- */
  function lifeTitle() {
    const f = S.flags, st = S.st, s = S.stat;
    const top = Object.keys(s).filter(k => k !== 'money').sort((a, b) => s[b] - s[a])[0];
    if (st === 'cm') { if (f.free && f.ransomed) return '값을 치르고 산 이름'; if (f.free) return '사슬을 끊고 걸어간 길'; if (f.runaway) return '산 너머로 간 사람'; if (top === 'family') return '행랑채에 핀 들꽃'; return '이름 없는 별의 노래'; }
    if (st === 'yb') { if (S.g === 'f') return f.ownProperty || f.secretStudy ? '닫힌 문 너머의 하늘' : '안채를 밝힌 등불'; if (f.exiled) return '귀양길에 핀 매화'; if (f.official) return s.honor >= 75 ? '붓 끝에 걸린 나라' : '사모관대의 무게'; if (f.teacher) return '서당 마루의 봄볕'; return '벼루에 비친 달'; }
    if (st === 'ji' && S.g === 'f') return '약재 향기 밴 손'; if (st === 'ji') { if (f.tradeRich || f.jiRich) return '비단길 위의 통역관'; if (f.jiCircle) return '두 세계 사이에서 핀 꽃'; return '이름 대신 남긴 솜씨'; }
    if (f.tradeRich) return '장터에서 피어난 꿈'; if (f.archer) return '성벽 위의 활잡이'; if (top === 'family') return '등잔불 아래 모인 얼굴들'; return '논두렁에 새긴 사계절';
  }
  function lastLine() {
    const s = S.stat, f = S.flags, n = S.name;
    const top = Object.keys(s).filter(k => k !== 'money').sort((a, b) => s[b] - s[a])[0];
    if (S.st === 'cm' && !f.free) return `평생 남의 이름 아래 살았지만, ${J(n, '은')} 마지막 순간 자신의 이름을 또렷이 불렀다. 그 이름만은 누구의 것도 아니었다.`;
    if (S.st === 'cm' && f.free) return `${J(n, '은')} 자유로운 몸으로 눈을 감았다. 그 자유는 태어날 때 주어진 것이 아니라, 평생에 걸쳐 스스로 얻어 낸 것이었다.`;
    if (f.treasure === 'family' || top === 'family') return `${n}의 마지막 숨결은 자신을 부르던 아이들의 목소리처럼 따뜻했다.`;
    if (top === 'learn') return `책장을 넘기던 손이 멈추었다. ${J(n, '이')} 남긴 글자들은 오래도록 누군가의 등불이 되었다.`;
    if (top === 'honor') return `사람들은 오래도록 ${J(n, '을')} 이야기했다. 그러나 ${J(n, '은')} 마지막에 이름보다 함께 걸어온 사람들을 떠올렸다.`;
    if (top === 'happy') return `봄바람이 마루를 스쳐 갔다. ${J(n, '은')} 웃는 얼굴로, 아주 긴 하루를 마친 사람처럼 잠들었다.`;
    return `노을이 지고 별이 떴다. ${n}의 한평생도 그렇게, 조용히 하늘로 건너갔다.`;
  }
  function openers() {
    const n = S.name, st = S.st, g = S.g;
    const sn = STN[st];
    return {
      1: `${n}${hasJong(n) ? '은' : '는'} 1480년, 성종 임금 시절 ${{ yb: '한양 북촌의 양반가', ji: '청계천 가까운 중인 집안', sm: '동래 고을의 가난한 농가', cm: '동래 김 진사 댁 행랑채' }[st]}에서 ${g === 'm' ? '아들' : '딸'}로 태어났다. ${sn}의 아이였다. ${{ yb: '태어날 때부터 배움과 벼슬의 길이 열려 있었지만, 가문의 기대 또한 함께 주어졌다.', ji: '집안 대대로 이어진 전문 기술이 그의 첫 재산이었다.', sm: '세금과 군역이라는 나라의 의무가 그 작은 어깨 위에 미리 놓여 있었다.', cm: '아기는 태어나는 순간 주인댁의 재산 목록에 이름이 올랐다.' }[st]}`,
      2: `어린 ${n}${hasJong(n) ? '은' : '는'} 세상이 신분이라는 보이지 않는 선으로 나뉘어 있다는 것을 조금씩 알아 갔다.`,
      3: `열다섯을 넘기며 ${n}의 앞에 저마다 다른 문이 열리고 또 닫혔다.`,
      4: `장년의 세월은 무겁고 빨랐다.`,
      5: `머리가 희어진 ${n}${hasJong(n) ? '은' : '는'} 지나온 날들을 천천히 되짚었다.`
    };
  }
  function buildMemoir() {
    const op = openers();
    const caps = { 1: '태어남', 2: '어린 시절', 3: '청년기', 4: '장년기', 5: '노년기', 6: '마지막 순간' };
    const chapters = [];
    for (let c = 1; c <= 5; c++) chapters.push({ h: caps[c], p: [op[c]].concat(S.memo[c] || []) });
    const s = S.stat, n = S.name;
    const wealth = s.money >= 400 ? `곳간에는 ${s.money}냥에 이르는 재산이 쌓였고` : s.money >= 150 ? `${s.money}냥의 재산이 남았고` : s.money >= 40 ? `넉넉하지 않은 ${s.money}냥이 전부였지만` : `손에 쥔 것은 거의 없었지만`;
    const fam = s.family >= 70 ? '곁에는 자식과 손주들이 빙 둘러앉아 있었다' : s.family >= 40 ? '곁을 지키는 가족이 있었다' : '곁은 조금 쓸쓸했다';
    const treasure = { family: '가족', self: { yb: '배움과 명예', ji: '자신의 손끝에 깃든 실력', sm: '흙과 땀', cm: S.flags.free ? '자유' : '자신의 이름' }[S.st], joy: '하루하루의 작은 기쁨' }[S.flags.treasure || 'joy'];
    const lost = [];
    if (S.flags.separated) lost.push('헤어진 가족');
    if (S.flags.exiled) lost.push('귀양으로 보낸 세월');
    if (S.flags.failed && !S.flags.official) lost.push('끝내 닿지 못한 벼슬');
    if (S.g === 'f' && (S.flags.secretStudy || S.st === 'yb')) lost.push('마음껏 배우지 못한 시간');
    if (S.st === 'cm' && !S.flags.free) lost.push('한 번도 자기 것이 아니었던 하루들');
    if (S.st === 'ji') lost.push(S.g === 'f' ? '여자라서 나설 수 없던 시험장' : '신분의 벽 앞에서 삼킨 말들');
    if (s.health < 35) lost.push('젊은 날의 건강');
    const gain = [];
    if (S.flags.official) gain.push('나랏일을 맡은 관리의 자리'); if (S.flags.techOfficial) gain.push('나라가 인정한 전문가의 이름'); if (S.flags.free) gain.push('양인의 신분'); if (S.flags.tradeRich) gain.push('장사로 일군 재산');
    if (s.learn >= 60) gain.push('깊은 학식'); if (s.honor >= 65) gain.push('사람들의 존경'); if (s.family >= 65) gain.push('화목한 가족');
    chapters.push({
      h: caps[6], p: [
        `${S.deathAge}세의 봄. ${wealth} ${fam}.`,
        gain.length ? `${J(n, '은')} 한평생 ${gain.join(', ')}을(를) 얻었다.` : `${J(n, '이')} 얻은 것은 크지 않았지만, 하루하루를 버텨 낸 시간 자체가 하나의 성취였다.`,
        lost.length ? `그리고 ${lost.join(', ')}을(를) 잃었다.` : '',
        `마지막으로 ${J(n, '은')} 생각했다. 내 인생에서 가장 소중했던 것은 ${treasure}이었다고.`,
        lastLine()
      ].filter(Boolean)
    });
    return { title: lifeTitle(), chapters };
  }
  function ending(review) {
    S.done = true; S.ch = 6; save();
    const go = () => {
      $('#panel').classList.remove('on'); $('#choices').classList.remove('on'); $('#hud').classList.remove('on');
      SND.mood('ending');
      showScene({ place: S.st === 'cm' && !S.flags.free ? 'yard' : S.st === 'sm' || S.st === 'cm' ? 'farm' : 'sarang', time: 'dusk', season: 'spring', cast: [{ P: true, x: 800, y: 840, s: 1.15, hold: 'cane', expr: 'happy', married: true }] });
      FX.set('petal');
      book();
    };
    if (review) go(); else chapterCard(6, go);
  }
  function book() {
    const M = buildMemoir();
    const st = S.stat;
    const allKn = Object.keys(KN);
    const pages = [];
    pages.push(`<div class="pg cover"><div class="cv-seal">${STH[S.st]}</div><div class="cv-title">${M.title}</div><div class="cv-sub">${S.name}의 일생<br>1480 ~ ${1480 + S.deathAge}</div><div class="cv-deco"></div></div>`);
    M.chapters.forEach((c, i) => pages.push(`<div class="pg"><div class="pg-ch">${['一', '二', '三', '四', '五', '六'][i]}</div><h4>${c.h}</h4>${c.p.map(x => `<p>${x}</p>`).join('')}</div>`));
    pages.push(`<div class="pg"><h4>인생 기록</h4><div class="rec">${STAT.map(s => `<div class="rec-row"><i>${s.h}</i><span>${s.n}</span><b>${s.k === 'money' ? st.money + '냥' : st[s.k]}</b>${s.k !== 'money' ? `<em><u style="width:${st[s.k]}%"></u></em>` : ''}</div>`).join('')}</div><p class="rec-note">신분 ${STN[S.st]}${S.flags.free && S.st === 'cm' ? ' → 양인(면천)' : ''} · ${S.g === 'm' ? '남자' : '여자'} · ${S.deathAge}세</p></div>`);
    pages.push(`<div class="pg"><h4>이번 생에서 만난 역사</h4><div class="knl">${allKn.map(k => `<div class="kn ${S.kn.includes(k) ? 'on' : ''}"><b>${S.kn.includes(k) ? '●' : '○'}</b><span>${KN[k].t}</span></div>`).join('')}</div><p class="rec-note">${allKn.filter(k => S.kn.includes(k)).length} / ${allKn.length}가지. 빈 동그라미는 다른 신분이나 성별로 살아 보면 만날 수 있어요.</p></div>`);
    pages.push(`<div class="pg last"><p class="q">과연 한 사람의 인생은<br>태어날 때 정해지는 것일까?</p><p class="q">내가 다른 신분으로 태어났다면<br>어떤 삶을 살았을까?</p><div class="pg-end">— 끝 —</div></div>`);
    const B = el(`<div class="book-wrap"><div class="book"><div class="page left"></div><div class="page right"></div><div class="flip"></div></div>
      <div class="book-ctrl"><button class="btn-sub" data-a="prev">◀ 이전 장</button><span class="pgno"></span><button class="btn-main" data-a="next">다음 장 ▶</button></div>
      <div class="book-act"><button class="btn-sub" data-a="first">처음부터 다시 읽기</button><button class="btn-sub" data-a="txt">이야기를 글 파일로 저장</button><button class="btn-sub" data-a="copy">글 복사하기</button><button class="btn-main" data-a="again">다른 인생 살아 보기</button></div></div>`);
    $('#ui').innerHTML = ''; $('#ui').appendChild(B);
    let sp = 0; const spreads = Math.ceil(pages.length / 2);
    const L = B.querySelector('.left'), R = B.querySelector('.right'), FL = B.querySelector('.flip');
    function render(dir) {
      const l = pages[sp * 2] || '', r = pages[sp * 2 + 1] || '<div class="pg blank"></div>';
      if (dir) { FL.className = 'flip go-' + dir; FL.innerHTML = dir === 'next' ? R.innerHTML : L.innerHTML; setTimeout(() => FL.className = 'flip', 700); SND.sfx('page'); }
      L.innerHTML = l; R.innerHTML = r;
      B.querySelector('.pgno').textContent = `${sp + 1} / ${spreads}`;
      B.querySelector('[data-a="prev"]').disabled = sp === 0; B.querySelector('[data-a="next"]').disabled = sp >= spreads - 1;
    }
    render();
    B.querySelector('[data-a="prev"]').onclick = () => { if (sp > 0) { sp--; render('prev'); } };
    B.querySelector('[data-a="next"]').onclick = () => { if (sp < spreads - 1) { sp++; render('next'); } };
    B.querySelector('[data-a="first"]').onclick = () => { sp = 0; render('prev'); };
    const text = () => {
      let t = `《${M.title}》\n${S.name}의 일생 (1480 ~ ${1480 + S.deathAge}) · ${STN[S.st]} · ${S.g === 'm' ? '남자' : '여자'}\n\n`;
      M.chapters.forEach(c => { t += `[${c.h}]\n${c.p.join('\n')}\n\n`; });
      t += `[인생 기록]\n${STAT.map(s => `${s.n}: ${s.k === 'money' ? st.money + '냥' : st[s.k]}`).join('  ')}\n\n[이번 생에서 만난 역사]\n${Object.keys(KN).filter(k => S.kn.includes(k)).map(k => '· ' + KN[k].t + ': ' + KN[k].b).join('\n')}\n\n과연 한 사람의 인생은 태어날 때 정해지는 것일까?\n내가 다른 신분으로 태어났다면 어떤 삶을 살았을까?\n\n— 《조선, 나의 인생》`;
      return t;
    };
    B.querySelector('[data-a="txt"]').onclick = e => {
      try { const blob = new Blob([text()], { type: 'text/plain;charset=utf-8' }); const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `조선_나의인생_${S.name}.txt`; document.body.appendChild(a); a.click(); a.remove(); toast('글 파일을 저장했어요.'); }
      catch (err) { toast('저장할 수 없는 환경이에요. "글 복사하기"를 써 주세요.'); }
    };
    B.querySelector('[data-a="copy"]').onclick = () => {
      const t = text();
      const fallback = () => { const ta = document.createElement('textarea'); ta.value = t; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); toast('글을 복사했어요.'); } catch (e) { toast('복사하지 못했어요.'); } ta.remove(); };
      if (navigator.clipboard) navigator.clipboard.writeText(t).then(() => toast('글을 복사했어요.'), fallback); else fallback();
    };
    B.querySelector('[data-a="again"]').onclick = () => { SND.sfx('click'); titleScreen(); };
  }
  function toast(m) { const t = el(`<div class="toast">${m}</div>`); document.getElementById('stage').appendChild(t); setTimeout(() => t.classList.add('on'), 10); setTimeout(() => { t.classList.remove('on'); setTimeout(() => t.remove(), 400); }, 2200); }

  function init() {
    fit(); addEventListener('resize', fit);
    FX.init();
    const sb = $('#snd');
    sb.onclick = e => { e.stopPropagation(); SND.unlock(); const on = SND.toggle(); sb.classList.toggle('off', !on); sb.title = on ? '소리 끄기' : '소리 켜기'; };
    $('#home').onclick = e => { e.stopPropagation(); if (S && !S.done && !confirm('처음 화면으로 갈까요? 진행 상황은 저장되어 "이어 살기"로 돌아올 수 있어요.')) return; MG.clearAll(); document.querySelectorAll('.mg,.fact,.chapter').forEach(x => x.remove()); titleScreen(); };
    titleScreen();
  }
  return { init, _state: () => S, _ev: () => ORDER, _next: nextEvent };
})();
window.addEventListener('load', GAME.init);
</script>
</body></html>
